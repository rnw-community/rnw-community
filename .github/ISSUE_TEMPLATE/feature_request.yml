name: Feature request
description: Propose a new export, option, or package.
title: '[<package>] '
labels: ['enhancement']
body:
    - type: input
      id: package
      attributes:
          label: Package
          description: The `@rnw-community/*` package this belongs to, or "new package".
          placeholder: shared
      validations:
          required: true
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: The use case and why the current public API does not cover it.
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposed API
          description: The call shape you want to write as a consumer, including types.
          render: ts
      validations:
          required: true
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
          description: Workarounds you use today or other designs you evaluated.
    - type: dropdown
      id: contribution
      attributes:
          label: Willing to open a pull request?
          options:
              - 'Yes'
              - 'No'
      validations:
          required: true
