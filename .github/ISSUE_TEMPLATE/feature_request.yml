name: Feature request
description: Propose a new export, option, or package.
title: '[<package>] '
labels: ['enhancement']
body:
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: The use case and why the current public API does not cover it.
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposed API
          description: The call shape you want to write as a consumer, including types.
          render: ts
