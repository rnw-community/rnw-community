name: Bug report
description: A published package behaves incorrectly, fails to install, or fails to resolve or type-check.
title: '[<package>] '
labels: ['bug']
body:
    - type: dropdown
      id: package
      attributes:
          label: Package
          options:
              - decorators-core
              - eslint-plugin
              - fast-style
              - histogram-metric-decorator
              - lock-decorator
              - log-decorator
              - nestjs-enterprise
              - nestjs-rxjs-lock
              - nestjs-rxjs-logger
              - nestjs-rxjs-metrics
              - nestjs-rxjs-redis
              - nestjs-typed-config
              - nestjs-webpack-swc
              - object-field-tree
              - platform
              - react-native-collapsible-header
              - react-native-payments
              - react-native-screen-chrome
              - redux-loadable
              - rxjs-errors
              - shared
              - wdio
              - Other / repository tooling
      validations:
          required: true
    - type: input
      id: package-version
      attributes:
          label: Package version
          placeholder: 2.28.3
      validations:
          required: true
    - type: textarea
      id: description
      attributes:
          label: What happened
          description: Observed versus expected behaviour, with the full error message and stack trace.
      validations:
          required: true
    - type: textarea
      id: reproduction
      attributes:
          label: Minimal reproduction
          description: A repository link or the smallest code snippet plus steps that reproduce the defect.
      validations:
          required: true
    - type: textarea
      id: environment
      attributes:
          label: Environment
          description: Node.js, package manager, TypeScript and `moduleResolution`, ESM or CommonJS, and the React Native / Expo / NestJS versions and platform where relevant.
          placeholder: 'Node 22.12, pnpm 11, TypeScript 5.9 (nodenext), react-native 0.88.0, iOS 26 simulator'
