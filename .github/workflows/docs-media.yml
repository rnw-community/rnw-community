name: Docs media

# Regenerates the react-native-payments docs media (#469) on demand: media churn
# is not code churn, so this never runs on push or schedule. The pull_request
# trigger only fires when the capture plumbing itself changes, which is also the
# only way to exercise a new version of this workflow before it reaches master.
# The APK build / emulator split: Gradle on a
# GitHub-hosted x86_64 runner, the KVM emulator on the self-hosted amd64 fleet,
# and the ffmpeg conversion back on a GitHub-hosted runner.
# iOS is not captured here yet: the Apple Pay loop needs the macOS fleet.

on:
    workflow_dispatch:
    pull_request:
        paths:
            - .github/workflows/docs-media.yml
            - packages/react-native-payments-example/e2e/recording/**

concurrency:
    group: docs-media-${{ github.ref }}
    cancel-in-progress: true

permissions: {}

env:
    MAESTRO_VERSION: '2.8.0'
    MAESTRO_CLI_NO_ANALYTICS: true
    MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: true
    EXAMPLE_DIR: packages/react-native-payments-example
    APP_DIR: packages/react-native-payments-example/apps/bare
    APP_ID: com.reactnativepaymentsexample

jobs:
    build-apk:
        name: Build APK (payments, bare)
        permissions:
            contents: read
        runs-on: ubuntu-24.04
        timeout-minutes: 35
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22.x
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build --filter="...@rnw-community/react-native-payments-example-bare"
            - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
              with:
                  packages: platform-tools
            - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: gradle-payments-bare-${{ runner.os }}-${{ hashFiles(format('{0}/android/gradle/wrapper/gradle-wrapper.properties', env.APP_DIR), format('{0}/android/**/*.gradle*', env.APP_DIR), format('{0}/package.json', env.APP_DIR), 'pnpm-lock.yaml') }}
                  restore-keys: gradle-payments-bare-${{ runner.os }}-
            - name: Build release APK
              working-directory: ${{ env.APP_DIR }}/android
              run: ./gradlew assembleRelease
            - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: apk-payments-bare
                  path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/*.apk
                  if-no-files-found: error
                  retention-days: 1

    record-android:
        name: Record Google Pay sheet
        needs: build-apk
        permissions:
            contents: read
        runs-on: [self-hosted, trf-linux-amd64-4x8]
        timeout-minutes: 30
        env:
            OUT_DIR: ${{ github.workspace }}/.ci-artifacts/recording
            ANDROID_SYSTEM_IMAGE: 'system-images;android-34;google_apis;x86_64'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: apk-payments-bare
                  path: .ci-artifacts/apk
            - name: Put the preinstalled Android SDK on PATH
              run: |
                  set -euo pipefail
                  for sdk in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /opt/android-sdk /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
                    if [ -z "$sdk" ] || [ ! -x "$sdk/emulator/emulator" ] || [ ! -x "$sdk/cmdline-tools/latest/bin/avdmanager" ]; then
                      continue
                    fi
                    { echo "ANDROID_HOME=$sdk"; echo "ANDROID_SDK_ROOT=$sdk"; } >> "$GITHUB_ENV"
                    printf '%s\n' "$sdk/cmdline-tools/latest/bin" "$sdk/platform-tools" "$sdk/emulator" >> "$GITHUB_PATH"
                    exit 0
                  done
                  echo "::error::No preinstalled Android SDK with an emulator on this runner."
                  exit 1
            - name: Boot the emulator
              run: |
                  set -euo pipefail
                  echo no | avdmanager create avd --force -n e2e -k "$ANDROID_SYSTEM_IMAGE"
                  printf '%s\n' hw.lcd.width=720 hw.lcd.height=1280 hw.lcd.density=320 skin.name=720x1280 skin.path=_no_skin \
                    hw.displayCutout=none hw.ramSize=2048 hw.keyboard=yes hw.gpu.enabled=yes hw.gpu.mode=swiftshader_indirect \
                    >> "${ANDROID_AVD_HOME:-$HOME/.android/avd}/e2e.avd/config.ini"
                  nohup emulator -avd e2e -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics \
                    > "$RUNNER_TEMP/emulator.log" 2>&1 &
                  adb start-server
                  timeout 120 adb wait-for-device
                  # shellcheck disable=SC2016
                  timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'
                  adb shell input keyevent 82 || true
                  timeout 180 adb shell am wait-for-broadcast-idle || true
            - name: Install Maestro
              run: |
                  set -euo pipefail
                  base="https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}"
                  dir="$RUNNER_TEMP/maestro-cli"
                  mkdir -p "$dir"
                  curl -fsSL --retry 3 -o "$dir/maestro.zip" "$base/maestro.zip"
                  curl -fsSL --retry 3 -o "$dir/checksums.txt" "$base/checksums_sha256.txt"
                  (cd "$dir" && awk '$2 == "maestro.zip"' checksums.txt | sha256sum -c -)
                  unzip -q "$dir/maestro.zip" -d "$dir"
                  echo "$dir/maestro/bin" >> "$GITHUB_PATH"
            - name: Install APK and record the sheet loop
              run: |
                  set -euo pipefail
                  adb install -r "$(find .ci-artifacts/apk -name '*.apk' | head -1)"
                  mkdir -p "$OUT_DIR"
                  cd "$EXAMPLE_DIR"
                  maestro test -e APP_ID="$APP_ID" --test-output-dir "$OUT_DIR" --debug-output "$OUT_DIR/debug" \
                    e2e/recording/android_sheet_capture.yaml
                  find . "$OUT_DIR" -name 'google-pay-sheet.*' -not -path "$OUT_DIR/google-pay-sheet.*" -exec cp {} "$OUT_DIR/" \;
                  test -f "$OUT_DIR/google-pay-sheet.mp4"
            - name: Stop the emulator
              if: always()
              run: |
                  adb emu kill || true
                  adb kill-server || true
            - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              if: always()
              with:
                  name: recording-android
                  path: ${{ env.OUT_DIR }}/**
                  if-no-files-found: warn
                  retention-days: 7

    convert:
        name: Convert recordings to GIF
        needs: record-android
        permissions: {}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: recording-android
                  path: recording
            - name: Convert MP4 to GIF
              run: |
                  set -euo pipefail
                  command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
                  mkdir -p media
                  cp recording/google-pay-sheet.mp4 media/
                  ffmpeg -y -loglevel error -i media/google-pay-sheet.mp4 \
                    -vf "fps=12,scale=320:-1:flags=lanczos,split[a][b];[a]palettegen=stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=4" \
                    -loop 0 media/google-pay-sheet.gif
                  ls -la media
            - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: docs-media-payments
                  path: media/*
                  if-no-files-found: error
                  retention-days: 30
