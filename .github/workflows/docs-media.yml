name: Docs media

# Regenerates the react-native-payments docs media (#469) on demand: media churn
# is not code churn, so this never runs on push or schedule. The pull_request
# trigger only fires when the capture plumbing itself changes, which is also the
# only way to exercise a new version of this workflow before it reaches master.
# mobile-ci's android-maestro.yml builds the bare app's arm64-v8a APK, and
# e2e/tests/payments-media records the Google Pay sheet on an emulator leased
# from the simlock farm: the `android-gms` target, the farm's image with Google
# Play services. The ffmpeg conversion runs on the portable Linux pool.
# iOS is not captured here yet: the farm's slimmed simulators cannot present the
# Apple Pay sheet.

on:
    workflow_dispatch:
    pull_request:
        paths:
            - .github/workflows/docs-media.yml
            - e2e/tests/payments-media/**

concurrency:
    group: docs-media-${{ github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    record:
        name: Record Google Pay sheet
        permissions:
            contents: read
            packages: write
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/android-maestro.yml@8a1e507c416f5b6fc54b910556ca3956ff2afde1 # v4.10.0
        with:
            control-runner-labels: '["self-hosted","linux-portable-2x4"]'
            targets: >-
                [{"name":"payments-media","appDir":"packages/react-native-payments-example/apps/bare","appId":"com.reactnativepaymentsexample","prebuildCommand":"","buildStrategy":"native"}]
            install-command: pnpm install --frozen-lockfile
            build-command: pnpm build --filter=...@rnw-community/react-native-payments-example-bare
            trigger-paths: |
                .github/workflows/docs-media.yml
                e2e/**
            build-timeout-minutes: 120
            android-abis: arm64-v8a
            test-framework: e2e
            e2e-dir: e2e
            e2e-command: npx e2e run --target android-gms
            e2e-runner-labels: '["self-hosted","linux-portable-2x4"]'
            e2e-retries: '0'
            e2e-timeout-minutes: 30
            simlock-url: https://simlock.vitaliiyehorov.dev
        secrets:
            simlock-token: ${{ secrets.SIMLOCK_TOKEN }}

    convert:
        name: Convert recordings to GIF
        needs: record
        if: needs.record.outputs.result == 'passed'
        permissions: {}
        runs-on: [self-hosted, linux-portable-2x4]
        timeout-minutes: 10
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: e2e-android-payments-media
                  path: capture
            - name: Convert MP4 to GIF
              run: |
                  set -euo pipefail
                  command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
                  mkdir -p media
                  cp capture/recording/google-pay-sheet.mp4 media/
                  ffmpeg -y -loglevel error -i media/google-pay-sheet.mp4 \
                    -vf "fps=12,scale=320:-1:flags=lanczos,split[a][b];[a]palettegen=stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=4" \
                    -loop 0 media/google-pay-sheet.gif
                  ls -la media
            - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: docs-media-payments
                  path: media/*
                  if-no-files-found: error
                  retention-days: 30
