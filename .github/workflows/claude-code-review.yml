name: Claude Code Review

on:
    pull_request:
        types: [opened, synchronize, ready_for_review, reopened]
        paths-ignore:
            - '.github/workflows/**'
        # Optional: Only run on specific file changes
        # paths:
        #   - "src/**/*.ts"
        #   - "src/**/*.tsx"
        #   - "src/**/*.js"
        #   - "src/**/*.jsx"

concurrency:
    group: claude-code-review-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions: {}

jobs:
    claude-review:
        # Optional: Filter by PR author
        # if: |
        #   github.event.pull_request.user.login == 'external-contributor' ||
        #   github.event.pull_request.user.login == 'new-developer' ||
        #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

        timeout-minutes: 30
        runs-on: [self-hosted, trf-linux-amd64-2x4]
        permissions:
            contents: read
            pull-requests: write # posts the sticky review comment
            issues: read
            id-token: write # OIDC exchange for the Claude GitHub App token

        steps:
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
                    fetch-depth: 1

            -   name: Run Claude Code Review
                id: claude-review
                uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
                with:
                    claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                    plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
                    plugins: 'code-review@claude-code-plugins'
                    prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
                    use_sticky_comment: true
