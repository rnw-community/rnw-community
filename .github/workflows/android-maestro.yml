name: Android Maestro E2E

# Runs the Maestro suite of every example package that carries one. Building the
# APK and running it against a device happen on two different runner pools, and
# that split is load-bearing, not stylistic:
#
# - build-apk runs on a free GitHub-hosted ubuntu-24.04 (x86_64) runner. This
#   repo is public, so the hosted runner costs nothing and keeps fleet capacity
#   for the part that actually needs a device.
# - maestro runs on the self-hosted x86_64 Linux fleet (tart-runner-fleet
#   scale set trf-rnw-linux-amd64-4x8) purely to install the prebuilt APK into
#   a KVM-accelerated Android emulator and drive Maestro. No Gradle, SDK, or
#   NDK step belongs in this job. The runner is an ephemeral rootless Podman
#   container with /dev/kvm passed through and the SDK plus the
#   system-images;android-34;google_apis;x86_64 image baked in — Google's own
#   image, with the Google Play services the payments suite needs.
#
# The emulator lifecycle, the Maestro install and the suite run come from
# rnw-community/mobile-ci's run-maestro-android action, which also fails closed
# when the runner has no usable KVM acceleration.
#
# The package/target matrix comes from .github/scripts/maestro-matrix.mjs,
# which also decides which suites a pull request actually needs; add new
# example packages there, not here.
on:
    workflow_dispatch:
    pull_request:
    push:
        branches: [master]
        paths:
            - packages/react-native-payments/**
            - packages/react-native-payments-example/**
            - packages/react-native-collapsible-header/**
            - packages/react-native-collapsible-header-example/**
            - .github/scripts/maestro-matrix.mjs
            - .github/workflows/android-maestro.yml
    schedule:
        - cron: '47 3 * * *'

concurrency:
    group: android-maestro-${{ github.ref }}
    cancel-in-progress: true

permissions: {}

env:
    MAESTRO_VERSION: '2.8.0'
    MAESTRO_CLI_NO_ANALYTICS: true
    MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: true

jobs:
    detect:
        name: Detect affected packages
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            matrix: ${{ steps.affected.outputs.matrix }}
            any: ${{ steps.affected.outputs.any }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22.x
                  package-manager-cache: false
            - name: Compute affected example packages
              id: affected
              env:
                  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
                  EVENT_NAME: ${{ github.event_name }}
              run: |
                  set -euo pipefail
                  # An empty file means "run every suite", which is the right answer both
                  # off pull requests and when the suites' own CI plumbing changed: turbo
                  # maps those files to no package, so package-based detection alone would
                  # skip every leg on exactly the changes that need testing most.
                  : > affected.json
                  if [ "$EVENT_NAME" = "pull_request" ]; then
                    # grep without -q: under pipefail, -q exits at the first match
                    # and a still-writing git diff then dies of SIGPIPE (status
                    # 141), which flips a real plumbing match into the turbo
                    # branch on diffs large enough to fill the pipe buffer.
                    if git diff --name-only "$TURBO_SCM_BASE" HEAD \
                      | grep -E '^\.github/(workflows/(ios|android)-maestro\.yml|scripts/maestro-matrix\.mjs)$'; then
                      echo "Maestro CI plumbing changed; every suite runs."
                    else
                      npx -y turbo@2.10.8 ls --affected --output=json > affected.json
                    fi
                  fi
                  node .github/scripts/maestro-matrix.mjs affected.json | tee -a "$GITHUB_OUTPUT"

    build-apk:
        name: Build APK (${{ matrix.package }}, ${{ matrix.target }})
        needs: detect
        if: needs.detect.outputs.any == 'true'
        permissions:
            contents: read
        runs-on: ubuntu-24.04
        # collapsible-header/expo's native build (react-native-reanimated,
        # 4-ABI CMake) measured at ~18 minutes on a clean run and blew a
        # 20-minute step timeout on a slower one, so the build step has 28
        # minutes and the job keeps real margin on top of it.
        timeout-minutes: 35
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.detect.outputs.matrix) }}
        env:
            APP_DIR: ${{ matrix.example_dir }}/apps/${{ matrix.target }}
            APK_DIR: ${{ matrix.example_dir }}/apps/${{ matrix.target }}/android/app/build/outputs/apk/release
        steps:
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                timeout-minutes: 10
                with:
                    persist-credentials: false

            -   name: Setup pnpm
                uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

            -   name: Setup Node
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                timeout-minutes: 10
                with:
                    node-version: 22.x
                    cache: pnpm

            -   name: Install dependencies
                timeout-minutes: 15
                run: pnpm install --frozen-lockfile

            -   name: Fingerprint the native surface
                id: fingerprint
                uses: rnw-community/mobile-ci/actions/native-fingerprint@3e9afaf1888bce8a3e4a70818d457ffa9de11d8d # v4.0.0
                timeout-minutes: 10
                with:
                    platform: android
                    working-directory: ${{ env.APP_DIR }}

            # The release APK embeds its JavaScript bundle, so a cached APK is
            # only this commit's APK when the JS that goes into the bundle is
            # unchanged too. The JS hash is computed once here, before any build
            # output exists, and reused verbatim by the save step.
            -   name: Compute the APK cache key
                id: app-key
                shell: bash
                env:
                    NATIVE_FINGERPRINT: ${{ steps.fingerprint.outputs.hash }}
                    JS_HASH: ${{ hashFiles('pnpm-lock.yaml', 'packages/*/package.json', 'packages/*/*.js', 'packages/*/src/**', format('{0}/apps/{1}/*', matrix.example_dir, matrix.target), format('{0}/apps/{1}/assets/**', matrix.example_dir, matrix.target)) }}
                run: echo "fingerprint=${NATIVE_FINGERPRINT}-${JS_HASH:0:16}" >> "$GITHUB_OUTPUT"

            -   name: Restore the built APK
                id: app-cache
                uses: rnw-community/mobile-ci/actions/native-app-cache@3e9afaf1888bce8a3e4a70818d457ffa9de11d8d # v4.0.0
                timeout-minutes: 10
                with:
                    mode: restore
                    path: ${{ env.APK_DIR }}
                    profile: android-${{ matrix.package }}-${{ matrix.target }}
                    arch: universal
                    toolchain: ubuntu-24.04
                    fingerprint: ${{ steps.app-key.outputs.fingerprint }}

            -   name: Build workspace JS dependencies
                if: steps.app-cache.outputs.cache-hit != 'true'
                timeout-minutes: 10
                env:
                    BUILD_FILTER: ${{ matrix.build_filter }}
                run: pnpm build --filter="${BUILD_FILTER}"

            -   name: Generate native project (expo)
                if: steps.app-cache.outputs.cache-hit != 'true' && matrix.target == 'expo'
                timeout-minutes: 10
                working-directory: ${{ matrix.example_dir }}
                run: pnpm prebuild:expo

            -   name: Set up Android SDK
                if: steps.app-cache.outputs.cache-hit != 'true'
                uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
                timeout-minutes: 15
                with:
                    # The action still defaults to "tools platform-tools", but the
                    # obsolete "tools" package was withdrawn from the Google SDK
                    # repository, so sdkmanager exits 1 with "Dependant package with
                    # key emulator not found!". Gradle resolves the build tools,
                    # platform, and NDK/cmake it needs on its own, so platform-tools
                    # is the only package this job has to request.
                    packages: platform-tools

            -   name: Restore Gradle cache
                if: steps.app-cache.outputs.cache-hit != 'true'
                uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
                timeout-minutes: 10
                with:
                    path: |
                        ~/.gradle/caches
                        ~/.gradle/wrapper
                    key: gradle-${{ matrix.package }}-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles(format('{0}/android/gradle/wrapper/gradle-wrapper.properties', env.APP_DIR), format('{0}/android/**/*.gradle*', env.APP_DIR), format('{0}/package.json', env.APP_DIR), format('{0}/app.json', env.APP_DIR), 'pnpm-lock.yaml') }}
                    restore-keys: |
                        gradle-${{ matrix.package }}-${{ matrix.target }}-${{ runner.os }}-

            -   name: Build release APK
                id: build
                if: steps.app-cache.outputs.cache-hit != 'true'
                # release, not debug: both example apps sign release with the
                # checked-in debug keystore (see app/build.gradle), so no signing
                # secret is needed here.
                timeout-minutes: 28
                working-directory: ${{ env.APP_DIR }}/android
                run: ./gradlew assembleRelease

            -   name: Save the built APK
                if: steps.build.outcome == 'success'
                uses: rnw-community/mobile-ci/actions/native-app-cache@3e9afaf1888bce8a3e4a70818d457ffa9de11d8d # v4.0.0
                continue-on-error: true
                timeout-minutes: 10
                with:
                    mode: save
                    path: ${{ env.APK_DIR }}
                    profile: android-${{ matrix.package }}-${{ matrix.target }}
                    arch: universal
                    toolchain: ubuntu-24.04
                    fingerprint: ${{ steps.app-key.outputs.fingerprint }}

            -   name: Upload APK artifact
                uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
                timeout-minutes: 5
                with:
                    name: apk-${{ matrix.package }}-${{ matrix.target }}
                    path: ${{ env.APK_DIR }}/app-release.apk
                    if-no-files-found: error
                    retention-days: 1

    maestro:
        name: Maestro (${{ matrix.package }}, ${{ matrix.target }})
        needs: [detect, build-apk]
        if: needs.detect.outputs.any == 'true'
        permissions:
            contents: read
        # 4x8, not 2x4: only the 4cpu/8GB profile of the amd64 scale set has
        # /dev/kvm. On any other shape the emulator falls back to pure
        # software emulation of x86_64-on-x86_64, which is slow enough that
        # every step budget below is wrong. The scale set also advertises its
        # own name (trf-rnw-linux-amd64-4x8) as a label if this ever has to be
        # pinned harder than the shape.
        runs-on: [self-hosted, trf-linux-amd64-4x8]
        # Self-hosted fleet capacity is shared with other repositories, so both the
        # job and every step below carry an explicit bound. This budget is
        # boot + settle + install + test only.
        timeout-minutes: 35
        strategy:
            fail-fast: false
            # One device at a time: a booted API-34 AVD measured ~4.2 GB RSS in
            # the 4x8 shape, so a handful of concurrent legs landing on one node
            # would contend for RAM and KVM before they contend for anything
            # else. The serialization stays until that headroom is measured
            # rather than assumed.
            max-parallel: 1
            matrix:
                include: ${{ fromJSON(needs.detect.outputs.matrix) }}

        steps:
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                timeout-minutes: 10
                with:
                    persist-credentials: false

            -   name: Download APK artifact
                uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
                timeout-minutes: 10
                with:
                    name: apk-${{ matrix.package }}-${{ matrix.target }}
                    path: .ci-artifacts/apk

            -   name: Install APK and run Maestro tests
                id: tests
                # Boot, install, warm-up, suite, capture and shutdown all live in
                # this one action, so its budget covers the old boot (12) and
                # install + suite (20) step budgets together.
                timeout-minutes: 32
                uses: rnw-community/mobile-ci/actions/run-maestro-android@3e9afaf1888bce8a3e4a70818d457ffa9de11d8d # v4.0.0
                with:
                    apk-path: .ci-artifacts/apk/app-release.apk
                    app-id: ${{ matrix.android_app_id }}
                    flows-dir: ${{ matrix.example_dir }}/e2e/flows
                    flows-name-pattern: '*.yaml'
                    shard-index: 0
                    shard-count: 1
                    maestro-version: ${{ env.MAESTRO_VERSION }}
                    # 720x1280 @ 320dpi with no display cutout: the 360x640dp
                    # viewport every flow's swipe percentages are calibrated
                    # against. pixel_6 (1080x2400 @ 420dpi with a punch-hole
                    # cutout) moves both the snap release point and every
                    # safe-area inset, and failed the collapsible-header suite.
                    profile: Galaxy Nexus
                    # sys.boot_completed flips before the launcher and Google Play
                    # services finish their first-run work, and the stock 256K
                    # logcat ring buffer only holds seconds of it. The geometry is
                    # asserted here because a profile that stopped being honoured
                    # would otherwise surface as unrelated-looking flow failures.
                    pre-test-command: |
                        adb logcat -G 16M || echo "::warning::could not resize the logcat ring buffer; the captured logcat will only cover the last few seconds."
                        timeout 180 bash -c 'until [ "$(adb shell getprop init.svc.bootanim | tr -d "\r")" = "stopped" ]; do sleep 5; done' \
                          || echo "::warning::init.svc.bootanim never reported 'stopped'; continuing, but the device may still be starting its launcher."
                        timeout 180 adb shell am wait-for-broadcast-idle \
                          || echo "::warning::'am wait-for-broadcast-idle' did not complete within 180s; continuing with a device that may still be draining boot broadcasts."
                        display_size="$(adb shell wm size | tr -d '\r')"
                        display_density="$(adb shell wm density | tr -d '\r')"
                        echo "$display_size / $display_density"
                        if ! grep -q '720x1280' <<<"$display_size" || ! grep -q '320' <<<"$display_density"; then
                          echo "::error::The emulator came up as '$display_size' / '$display_density', not the 720x1280 @ 320dpi display this suite's Maestro flows are calibrated against."
                          exit 1
                        fi
                    artifacts-dir: ${{ github.workspace }}/${{ matrix.example_dir }}/artifacts/maestro-android-${{ matrix.package }}-${{ matrix.target }}
                    artifact-name: maestro-android-${{ matrix.package }}-${{ matrix.target }}

    status:
        name: Android Maestro E2E result
        needs: [detect, build-apk, maestro]
        if: always()
        runs-on: ubuntu-latest
        permissions: {}
        steps:
            - name: Report
              env:
                  NEEDS_DETECT_RESULT: ${{ needs.detect.result }}
                  NEEDS_DETECT_OUTPUTS_ANY: ${{ needs.detect.outputs.any }}
                  NEEDS_BUILD_APK_RESULT: ${{ needs.build-apk.result }}
                  NEEDS_MAESTRO_RESULT: ${{ needs.maestro.result }}
              run: |
                  if [ "${NEEDS_DETECT_RESULT}" != "success" ]; then
                    echo "Detection job did not succeed."
                    exit 1
                  fi
                  if [ "${NEEDS_DETECT_OUTPUTS_ANY}" != "true" ]; then
                    echo "Skipped: no example package dependency tree was touched."
                    exit 0
                  fi
                  if [ "${NEEDS_BUILD_APK_RESULT}" != "success" ]; then
                    echo "APK build failed."
                    exit 1
                  fi
                  if [ "${NEEDS_MAESTRO_RESULT}" != "success" ]; then
                    echo "Maestro suite failed."
                    exit 1
                  fi
                  echo "Maestro suite passed."
