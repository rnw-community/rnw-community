name: Android E2E

# Thin caller of rnw-community/mobile-ci's android-maestro.yml: one call builds
# every example package's arm64-v8a APK and runs its e2e/tests/<package> suite on
# emulators leased from the simlock farm. Bare apps cannot be repacked, so they
# always build natively.
on:
    workflow_dispatch:
    pull_request:
    push:
        branches: [master]
        paths:
            - packages/react-native-payments/**
            - packages/react-native-payments-example/**
            - packages/react-native-collapsible-header/**
            - packages/react-native-collapsible-header-example/**
            - e2e/**
            - .github/workflows/android-maestro.yml
    schedule:
        - cron: '47 3 * * *'

permissions: {}

jobs:
    e2e:
        permissions:
            contents: read
            packages: write
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/android-maestro.yml@8a1e507c416f5b6fc54b910556ca3956ff2afde1 # v4.10.0
        with:
            control-runner-labels: '["self-hosted","linux-portable-2x4"]'
            targets: >-
                [
                  {"name":"payments-bare","appDir":"packages/react-native-payments-example/apps/bare","appId":"com.reactnativepaymentsexample","prebuildCommand":"","buildStrategy":"native"},
                  {"name":"payments-expo","appDir":"packages/react-native-payments-example/apps/expo","appId":"com.reactnativepaymentsexpoexample","prebuildCommand":"pnpm prebuild"},
                  {"name":"collapsible-header-bare","appDir":"packages/react-native-collapsible-header-example/apps/bare","appId":"com.reactnativecollapsibleheaderexample","prebuildCommand":"","buildStrategy":"native"},
                  {"name":"collapsible-header-expo","appDir":"packages/react-native-collapsible-header-example/apps/expo","appId":"com.reactnativecollapsibleheaderexpoexample","prebuildCommand":"pnpm prebuild"},
                  {"name":"screen-chrome-bare","appDir":"packages/react-native-screen-chrome-example/apps/bare","appId":"com.reactnativescreenchromeexample","prebuildCommand":"","buildStrategy":"native"},
                  {"name":"screen-chrome-expo","appDir":"packages/react-native-screen-chrome-example/apps/expo","appId":"com.reactnativescreenchromeexpoexample","prebuildCommand":"pnpm prebuild"}
                ]
            install-command: pnpm install --frozen-lockfile
            build-command: pnpm build --filter=...@rnw-community/react-native-payments-example-bare --filter=...@rnw-community/react-native-payments-example-expo --filter=...@rnw-community/react-native-collapsible-header-example-bare --filter=...@rnw-community/react-native-collapsible-header-example-expo --filter=...@rnw-community/react-native-screen-chrome-example-bare --filter=...@rnw-community/react-native-screen-chrome-example-expo
            exempt-paths: |
                **/*.md
                **/llms*.txt
                **/docs/**
            trigger-paths: |
                .github/workflows/ios-maestro.yml
                .github/workflows/android-maestro.yml
                e2e/**
            build-timeout-minutes: 120
            # The farm's emulator image is arm64-v8a.
            android-abis: arm64-v8a
            # The e2e/ suite, run from Linux against emulators leased from the Mac Studio simlock farm: no
            # emulator runs on the CI host. The public gateway, because only one Linux host shares the farm's LAN.
            test-framework: e2e
            e2e-dir: e2e
            e2e-runner-labels: '["self-hosted","linux-portable-4x8"]'
            e2e-workers: '1'
            e2e-retries: '1'
            e2e-timeout-minutes: 60
            simlock-url: https://simlock.vitaliiyehorov.dev
        secrets:
            simlock-token: ${{ secrets.SIMLOCK_TOKEN }}
