name: Android Maestro E2E

on:
    workflow_dispatch:
    pull_request:
    push:
        branches: [master]
        paths:
            - packages/react-native-payments/**
            - packages/react-native-payments-example/**
            - .github/workflows/android-maestro.yml
    schedule:
        - cron: '47 3 * * *'

concurrency:
    group: android-maestro-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    e2e:
        uses: rnw-community/mobile-ci/.github/workflows/android-maestro.yml@0d82cf6287e64151cb16859732929cf39a0910dc # v1.4.2
        with:
            build-runner-labels: '["self-hosted","macOS","ARM64","macos-maestro"]'
            test-runner-labels: '["self-hosted","linux-tiered","linux-xl"]'
            targets: >-
                [{"name":"bare","appDir":"packages/react-native-payments-example/apps/bare","appId":"com.reactnativepaymentsexample","prebuildCommand":""},{"name":"expo","appDir":"packages/react-native-payments-example/apps/expo","appId":"com.reactnativepaymentsexpoexample","prebuildCommand":"yarn prebuild"}]
            flows-dir: packages/react-native-payments-example/e2e/flows
            flows-name-pattern: '*.yaml *.yml'
            shard-count: 2
            target-packages: |
                @rnw-community/react-native-payments
                @rnw-community/react-native-payments-example
                @rnw-community/react-native-payments-example-bare
                @rnw-community/react-native-payments-example-expo
            build-command: yarn build --filter=@rnw-community/react-native-payments
            repack-on-hit: true
            # Self-hosted fleet capacity is shared with other repositories, so no job
            # may run unbounded. A workflow_call job cannot carry timeout-minutes, so
            # the caps come from the reusable workflow's inputs instead of the caller
            # job. Build (macOS pool): install + JS build + prebuild + a cold Gradle
            # release build. Test (Redroid pool): container pull/boot (bounded
            # upstream at 600s) plus one Maestro shard.
            build-timeout-minutes: 45
            test-timeout-minutes: 35
