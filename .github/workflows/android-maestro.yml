name: Android Maestro E2E

# Draft workflow for issue #395 (react-native-payments revival, epic #372),
# canary-optimized per issue #447: fingerprinted native-app cache seeded by
# seed-native-cache.yml plus a build/test split with Maestro shards.
#
# Build (native APK) runs on the self-hosted macOS fleet (macos-maestro), not
# a Linux runner: Google does not publish linux-aarch64 builds of the Android
# SDK's cmake, NDK toolchain, or emulator packages (confirmed against this
# fleet's actual runner and Google's own issue tracker,
# issuetracker.google.com/issues/397407933) — sdkmanager silently installs
# the x86_64 Linux binaries regardless of host arch, and executing them on
# this fleet's linux-aarch64 runners fails at the kernel level (surfaces as a
# shell "Syntax error" from the exec-format mismatch, not a clean error
# message). The Android NDK's "darwin-x86_64" toolchain, despite the name,
# ships as a universal (fat) Mach-O binary that runs natively on Apple
# Silicon, so the identical native-build step that is structurally broken on
# linux-aarch64 works unmodified here.
#
# Test (Maestro execution) runs on the self-hosted Linux fleet
# ([self-hosted, linux-tiered, linux-xl]) via Redroid — Android-in-a-
# privileged-container over the binder_linux kernel module — instead of an
# AVD emulator. This sidesteps the gap above entirely rather than working
# around it: Redroid needs no sdkmanager, no NDK, no emulator binary on the
# runner at all, just a prewarmed container image and the host's binder
# module, so the linux-aarch64 block above never applies to this job. The
# container-bring-up plumbing (docker run --privileged, adb connect,
# boot-completed wait, APK install) is adapted from a sister project's
# android-maestro.yml, where it was observed reliable across several runs;
# that project's own Maestro *flow assertions* were failing at the time
# (element-not-found on one screen's custom grid under Redroid's guest GPU
# mode), which is an app-level concern, not a Redroid-plumbing one — so this
# is an adaptation of an in-progress technique, not a port of a green
# pipeline. Keeps the macOS fleet free for iOS-only Maestro; Android build
# still cross-compiles on macOS (build job, unchanged) since the NDK/cmake
# gap above is a build-time problem this job never touches. Requires the
# linux-xl runner image to carry a Redroid prewarm (docker + a pulled arm64
# redroid/redroid image + a prewarmed /data volume, manifest at
# $HOME/.rnw-ci/android-emulator.json) — unverified on this fleet as of this
# commit; the "Start prewarmed Redroid container" step fails fast with a
# clear error if that prewarm is missing rather than hanging on a per-shard
# multi-GB cold `docker pull`.
on:
    workflow_dispatch:
    pull_request:
    push:
        branches: [master]
        paths:
            - packages/react-native-payments/**
            - packages/react-native-payments-example/**
            - yarn.lock
            - package.json
            - .github/workflows/android-maestro.yml
    schedule:
        - cron: '47 3 * * *'

concurrency:
    group: android-maestro-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    MAESTRO_VERSION: '2.8.0'
    MAESTRO_CLI_NO_ANALYTICS: true
    MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: true
    MAESTRO_SHARD_COUNT: '2'
    EXPO_FINGERPRINT_VERSION: '0.20.6'
    ANDROID_CMDLINE_TOOLS_VERSION: '12266719'
    YARN_ENABLE_IMMUTABLE_INSTALLS: true
    EXAMPLE_DIR: packages/react-native-payments-example

jobs:
    detect:
        name: Detect affected packages
        runs-on: ubuntu-latest
        outputs:
            payments_affected: ${{ steps.affected.outputs.payments_affected }}
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@v5
              with:
                  node-version: 22.x
            - name: Compute affected packages
              id: affected
              env:
                  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
              run: |
                  if [ "${{ github.event_name }}" != "pull_request" ]; then
                    echo "payments_affected=true" >> "$GITHUB_OUTPUT"
                    echo "Non-PR event: payments pipeline always runs."
                    exit 0
                  fi
                  affected=$(npx -y turbo@2.10.8 ls --affected --output=json | node -e '
                    let raw = "";
                    process.stdin.on("data", chunk => (raw += chunk));
                    process.stdin.on("end", () => {
                      const names = (JSON.parse(raw).packages?.items ?? []).map(item => item.name);
                      const targets = [
                        "@rnw-community/react-native-payments",
                        "@rnw-community/react-native-payments-example",
                        "@rnw-community/react-native-payments-example-bare",
                        "@rnw-community/react-native-payments-example-expo",
                      ];
                      process.stdout.write(String(names.some(name => targets.includes(name))));
                    });
                  ')
                  echo "payments_affected=${affected}" >> "$GITHUB_OUTPUT"
                  echo "payments_affected=${affected}"

    build:
        name: Build (${{ matrix.target }})
        needs: detect
        if: needs.detect.outputs.payments_affected == 'true'
        runs-on: [self-hosted, macOS, ARM64, macos-maestro]
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                target: [bare, expo]
        env:
            APP_DIR: packages/react-native-payments-example/apps/${{ matrix.target }}

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v5
                with:
                    persist-credentials: false

            -   name: Setup Node
                uses: actions/setup-node@v5
                with:
                    node-version: 22.x
                    cache: yarn

            -   name: Enable corepack
                run: corepack enable

            -   name: Install dependencies
                run: yarn install --immutable

            -   name: Build workspace JS dependencies
                run: yarn build --filter=@rnw-community/react-native-payments

            -   name: Generate native project (expo)
                if: matrix.target == 'expo'
                working-directory: ${{ env.EXAMPLE_DIR }}
                run: yarn prebuild:expo

            -   name: Generate native fingerprint
                id: fingerprint
                working-directory: ${{ env.APP_DIR }}
                run: |
                    set -euo pipefail
                    npx --yes "@expo/fingerprint@${EXPO_FINGERPRINT_VERSION}" fingerprint:generate --platform android > "$RUNNER_TEMP/android-fingerprint-${{ matrix.target }}.json"
                    hash=$(node -e "process.stdout.write(require('$RUNNER_TEMP/android-fingerprint-${{ matrix.target }}.json').hash)")
                    test -n "$hash"
                    echo "hash=$hash" >> "$GITHUB_OUTPUT"
                    echo "Native fingerprint (${{ matrix.target }}): $hash"

            -   name: Restore canonical native app
                id: native-app-cache
                uses: actions/cache/restore@v4
                with:
                    path: .ci-cache/android-native-app/${{ matrix.target }}
                    key: android-native-v1-${{ matrix.target }}-${{ runner.os }}-cmdline-${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}-${{ steps.fingerprint.outputs.hash }}

            # Cache hit means the native shell for this fingerprint is safe to
            # reuse — Gradle assembly is skipped entirely. The fingerprint
            # tracks native surface only, so a hit does not guarantee the
            # embedded JS bundle reflects the current commit's app-layer JS.
            # v1 accepts this gap; the rebundle+repack refinement is
            # documented follow-up (see seed-native-cache.yml header and the
            # matching note in ios-maestro.yml).
            -   name: Report cache hit
                if: steps.native-app-cache.outputs.cache-hit == 'true'
                run: |
                    {
                      echo "### Android build: ${{ matrix.target }} (warm — native build skipped)"
                      echo "Native fingerprint hit; embedded JS bundle dates from when this shell was cached."
                    } >> "$GITHUB_STEP_SUMMARY"

            # accept-android-sdk-licenses is disabled here because the action's
            # own "sdkmanager --licenses" call walks the dependency graph of
            # the *entire* remote repository listing, unscoped to the
            # packages this workflow actually needs — including legacy,
            # deprecated packages this workflow never touches. Pre-seeding
            # the two publicly documented license hashes below satisfies
            # every consumer (this step's own `packages` install and Gradle)
            # without ever invoking that unscoped walk, on any host platform.
            # The `test` job below no longer needs an SDK at all — it runs
            # Maestro against a Redroid container, not an AVD emulator.
            -   name: Set up Android SDK
                if: steps.native-app-cache.outputs.cache-hit != 'true'
                uses: android-actions/setup-android@v3
                with:
                    cmdline-tools-version: ${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}
                    accept-android-sdk-licenses: false
                    packages: platform-tools

            -   name: Accept Android SDK licenses
                if: steps.native-app-cache.outputs.cache-hit != 'true'
                run: |
                    set -euo pipefail
                    mkdir -p "$ANDROID_HOME/licenses"
                    printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$ANDROID_HOME/licenses/android-sdk-license"
                    printf '84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"

            -   name: Setup JDK
                if: steps.native-app-cache.outputs.cache-hit != 'true'
                uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: '17'

            -   name: Restore Gradle cache
                if: steps.native-app-cache.outputs.cache-hit != 'true'
                uses: actions/cache/restore@v4
                with:
                    path: |
                        ~/.gradle/caches
                        ~/.gradle/wrapper
                    key: gradle-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles(format('{0}/android/gradle/wrapper/gradle-wrapper.properties', env.APP_DIR), format('{0}/android/**/*.gradle*', env.APP_DIR), format('{0}/package.json', env.APP_DIR), format('{0}/app.json', env.APP_DIR), 'yarn.lock') }}
                    restore-keys: |
                        gradle-${{ matrix.target }}-${{ runner.os }}-

            -   name: Build APK (Release)
                if: steps.native-app-cache.outputs.cache-hit != 'true'
                working-directory: ${{ env.APP_DIR }}/android
                shell: bash
                run: |
                    set -euo pipefail
                    build_start=$(date +%s)
                    ./gradlew assembleRelease
                    build_end=$(date +%s)
                    {
                      echo "### Android build: ${{ matrix.target }} (cold — native build ran)"
                      echo "Duration: $((build_end - build_start))s"
                    } >> "$GITHUB_STEP_SUMMARY"

            -   name: Diagnose NDK/cmake host architecture
                if: always() && steps.native-app-cache.outputs.cache-hit != 'true'
                run: |
                    {
                      echo "### NDK/cmake host arch diagnostic (${{ matrix.target }})"
                      echo '```'
                      echo "uname -m: $(uname -m)"
                      echo "--- cmake binaries under ANDROID_HOME/cmake ---"
                      find "$ANDROID_HOME/cmake" -type f -perm -u+x -iname 'cmake' 2>/dev/null | while read -r bin; do
                        echo "$bin: $(file -b "$bin" 2>/dev/null || echo 'file unavailable')"
                      done
                      echo "--- ANDROID_HOME/ndk/*/toolchains/llvm/prebuilt listing ---"
                      find "$ANDROID_HOME/ndk" -maxdepth 4 -type d -path '*/toolchains/llvm/prebuilt' 2>/dev/null | while read -r d; do
                        echo "$d:"; ls -1 "$d" 2>/dev/null
                      done
                      echo '```'
                    } >> "$GITHUB_STEP_SUMMARY"

            -   name: Save Gradle cache
                if: steps.native-app-cache.outputs.cache-hit != 'true'
                uses: actions/cache/save@v4
                with:
                    path: |
                        ~/.gradle/caches
                        ~/.gradle/wrapper
                    key: gradle-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles(format('{0}/android/gradle/wrapper/gradle-wrapper.properties', env.APP_DIR), format('{0}/android/**/*.gradle*', env.APP_DIR), format('{0}/package.json', env.APP_DIR), format('{0}/app.json', env.APP_DIR), 'yarn.lock') }}

            -   name: Package native app
                if: steps.native-app-cache.outputs.cache-hit != 'true'
                shell: bash
                env:
                    TARGET: ${{ matrix.target }}
                run: |
                    set -euo pipefail
                    apks=()
                    while IFS= read -r apk; do
                      apks+=("$apk")
                    done < <(find "$APP_DIR/android/app/build/outputs/apk/release" \
                               -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' | sort)
                    if [ "${#apks[@]}" -ne 1 ]; then
                      echo "::error::Expected exactly 1 signed release APK, found ${#apks[@]}: ${apks[*]}"
                      exit 1
                    fi
                    apk_path="${apks[0]}"
                    apk_listing=$(unzip -l "$apk_path")
                    grep -q 'assets/index.android.bundle' <<< "$apk_listing"
                    mkdir -p ".ci-cache/android-native-app/$TARGET"
                    cp "$apk_path" ".ci-cache/android-native-app/$TARGET/app-release.apk"
                    mkdir -p "ci-artifacts/android-e2e-app-$TARGET"
                    cp "$apk_path" "ci-artifacts/android-e2e-app-$TARGET/app-release.apk"

            -   name: Save canonical native app
                if: steps.native-app-cache.outputs.cache-hit != 'true'
                uses: actions/cache/save@v4
                with:
                    path: .ci-cache/android-native-app/${{ matrix.target }}
                    key: android-native-v1-${{ matrix.target }}-${{ runner.os }}-cmdline-${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}-${{ steps.fingerprint.outputs.hash }}

            # "Package native app" (the step that stages ci-artifacts/) only runs
            # on a cache miss. Stage the restored cache-hit APK the same way here
            # so the unconditional upload-artifact step below always finds one.
            -   name: Stage native app for upload (cache hit)
                if: steps.native-app-cache.outputs.cache-hit == 'true'
                shell: bash
                env:
                    TARGET: ${{ matrix.target }}
                run: |
                    set -euo pipefail
                    mkdir -p "ci-artifacts/android-e2e-app-$TARGET"
                    cp ".ci-cache/android-native-app/$TARGET/app-release.apk" "ci-artifacts/android-e2e-app-$TARGET/app-release.apk"

            -   uses: actions/upload-artifact@v4
                with:
                    name: android-e2e-app-${{ matrix.target }}
                    path: ci-artifacts/android-e2e-app-${{ matrix.target }}/app-release.apk
                    retention-days: 1

    test:
        name: Maestro shard ${{ matrix.shard-index }} (${{ matrix.target }})
        needs: [detect, build]
        if: needs.detect.outputs.payments_affected == 'true'
        runs-on: [self-hosted, linux-tiered, linux-xl]
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                target: [bare, expo]
                shard-index: [0, 1]
        env:
            MAESTRO_DEBUG_OUTPUT_DIRECTORY: ${{ github.workspace }}/packages/react-native-payments-example/artifacts/maestro-android-${{ matrix.target }}-${{ matrix.shard-index }}

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v5
                with:
                    persist-credentials: false

            # 4 shard cells (2 targets x 2 shard-index) can land on the same
            # linux-xl host concurrently — unlike the sister repo's single,
            # unsharded job, so its fixed container name/adb port would
            # collide here. Give every cell its own container and adb port.
            -   name: Resolve target metadata
                id: meta
                run: |
                    set -euo pipefail
                    case "${{ matrix.target }}" in
                      bare) echo "app_id=com.reactnativepaymentsexample" >> "$GITHUB_OUTPUT"; target_index=0 ;;
                      expo) echo "app_id=com.reactnativepaymentsexpoexample" >> "$GITHUB_OUTPUT"; target_index=1 ;;
                    esac
                    cell_index=$(( target_index * 2 + ${{ matrix.shard-index }} ))
                    echo "adb_port=$(( 5555 + cell_index * 10 ))" >> "$GITHUB_OUTPUT"
                    echo "container_name=redroid-e2e-${{ matrix.target }}-${{ matrix.shard-index }}" >> "$GITHUB_OUTPUT"

            # Ported from the sister sudoku-game repo's android-maestro.yml:
            # container boot, adb connect, and the boot-completed wait were
            # verified reliable there across several runs (only that repo's
            # own Maestro flow assertions were failing, not this bring-up).
            # --memory/--cpus below are halved from that repo's single-job
            # 6g/4cpu request (to 3g/2cpu) since up to 4 of these run
            # concurrently on one linux-xl host here versus their 1 — revisit
            # once real contention on this runner pool is observed.
            -   name: Start prewarmed Redroid container
                id: redroid
                shell: bash
                run: |
                    set -euo pipefail
                    manifest="$HOME/.rnw-ci/android-emulator.json"
                    test -f "$manifest" || {
                      echo '::error::The guest image lacks the Redroid prewarm; provision docker + a pulled redroid/redroid arm64 image + a prewarmed /data volume on this runner image first.'
                      exit 1
                    }
                    image=$(python3 -c "import json; print(json.load(open('$manifest'))['image'])")
                    data=$(python3 -c "import json; print(json.load(open('$manifest'))['dataDir'])")
                    echo "REDROID_PREWARM_OK image=$image dataDir=$data"
                    sudo modprobe binder_linux devices=binder,hwbinder,vndbinder 2>/dev/null || true
                    sudo docker rm -f "${{ steps.meta.outputs.container_name }}" >/dev/null 2>&1 || true
                    sudo docker run -d --name "${{ steps.meta.outputs.container_name }}" --privileged \
                      --memory 3g --memory-swap 3g --cpus 2 \
                      -v "$data":/data -p ${{ steps.meta.outputs.adb_port }}:5555 \
                      "$image" androidboot.redroid_gpu_mode=guest
                    adb connect "localhost:${{ steps.meta.outputs.adb_port }}"
                    deadline=$(( $(date +%s) + 300 ))
                    until [ "$(adb -s "localhost:${{ steps.meta.outputs.adb_port }}" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
                      test "$(date +%s)" -lt "$deadline"
                      sleep 5
                      adb connect "localhost:${{ steps.meta.outputs.adb_port }}" >/dev/null 2>&1 || true
                    done
                    echo "ANDROID_SERIAL=localhost:${{ steps.meta.outputs.adb_port }}" >> "$GITHUB_ENV"

            -   uses: actions/download-artifact@v4
                with:
                    name: android-e2e-app-${{ matrix.target }}
                    path: .ci-artifacts/android-e2e-app-${{ matrix.target }}

            -   name: Install APK
                run: adb -s "${{ env.ANDROID_SERIAL }}" install -r ".ci-artifacts/android-e2e-app-${{ matrix.target }}/app-release.apk"

            -   name: Install Maestro
                run: |
                    maestro_bin="$HOME/.maestro/bin/maestro"
                    if [ ! -x "$maestro_bin" ] || [ "$("$maestro_bin" --version 2>/dev/null | tail -n 1 | tr -d '\r' || true)" != "$MAESTRO_VERSION" ]; then
                      curl -fsSL https://get.maestro.mobile.dev | env MAESTRO_VERSION="$MAESTRO_VERSION" bash
                    fi
                    echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

            -   name: Run Maestro shard
                shell: bash
                run: |
                    set -euo pipefail
                    flows=()
                    while IFS= read -r flow; do
                      flows+=("$flow")
                    done < <(find "${{ env.EXAMPLE_DIR }}/e2e/flows" -type f \( -name '*.yaml' -o -name '*.yml' \) | sort)
                    test "${#flows[@]}" -gt 0
                    selected=()
                    for index in "${!flows[@]}"; do
                      if (( index % MAESTRO_SHARD_COUNT == ${{ matrix.shard-index }} )); then
                        selected+=("${flows[$index]}")
                      fi
                    done
                    if [ "${#selected[@]}" -eq 0 ]; then
                      echo "Shard ${{ matrix.shard-index }} has no flows; nothing to run."
                      exit 0
                    fi
                    printf 'Shard ${{ matrix.shard-index }} flows:\n%s\n' "${selected[*]}"
                    maestro test -e "APP_ID=${{ steps.meta.outputs.app_id }}" "${selected[@]}"

            -   name: Capture final device state
                if: always()
                shell: bash
                run: |
                    out="${{ env.MAESTRO_DEBUG_OUTPUT_DIRECTORY }}"
                    mkdir -p "$out"
                    adb -s "${{ env.ANDROID_SERIAL }}" exec-out screencap -p > "$out/final-screen.png" || true
                    adb -s "${{ env.ANDROID_SERIAL }}" logcat -d > "$out/logcat-full.txt" 2>&1 || true
                    adb -s "${{ env.ANDROID_SERIAL }}" logcat -d -b crash > "$out/logcat-crash.txt" 2>&1 || true

            -   name: Teardown Redroid container
                if: always()
                run: sudo docker rm -f "${{ steps.meta.outputs.container_name }}" || true

            -   name: Upload Maestro artifacts
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: maestro-android-${{ matrix.target }}-shard-${{ matrix.shard-index }}
                    path: ${{ env.MAESTRO_DEBUG_OUTPUT_DIRECTORY }}/**
                    if-no-files-found: warn
                    retention-days: 7

    status:
        name: Android Maestro E2E result
        needs: [detect, build, test]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Report
              run: |
                  if [ "${{ needs.detect.result }}" != "success" ]; then
                    echo "Detection job did not succeed."
                    exit 1
                  fi
                  if [ "${{ needs.detect.outputs.payments_affected }}" != "true" ]; then
                    echo "Skipped: payments dependency tree untouched."
                    exit 0
                  fi
                  if [ "${{ needs.build.result }}" != "success" ]; then
                    echo "Build job failed."
                    exit 1
                  fi
                  if [ "${{ needs.test.result }}" != "success" ]; then
                    echo "Maestro suite failed."
                    exit 1
                  fi
                  echo "Maestro suite passed."
