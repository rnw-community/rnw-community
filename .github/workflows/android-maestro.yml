name: Android Maestro E2E

# Draft workflow for issue #395 (react-native-payments revival, epic #372),
# canary-optimized per issue #447: fingerprinted native-app cache seeded by
# seed-native-cache.yml plus a build/test split with Maestro shards. The
# self-hosted Linux fleet is a single runner, so shard matrix jobs queue
# rather than run concurrently — that is expected and safe.
on:
    workflow_dispatch:
    pull_request:
    push:
        branches: [master]
        paths:
            - packages/react-native-payments/**
            - packages/react-native-payments-example/**
            - .github/workflows/android-maestro.yml
    schedule:
        - cron: '47 3 * * *'

concurrency:
    group: android-maestro-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    MAESTRO_VERSION: '2.8.0'
    MAESTRO_CLI_NO_ANALYTICS: true
    MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: true
    MAESTRO_SHARD_COUNT: '2'
    EXPO_FINGERPRINT_VERSION: '0.20.6'
    ANDROID_CMDLINE_TOOLS_VERSION: '14742923'
    YARN_ENABLE_IMMUTABLE_INSTALLS: true
    EXAMPLE_DIR: packages/react-native-payments-example

jobs:
    detect:
        name: Detect affected packages
        runs-on: ubuntu-latest
        outputs:
            payments_affected: ${{ steps.affected.outputs.payments_affected }}
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@v5
              with:
                  node-version: 22.x
            - name: Compute affected packages
              id: affected
              env:
                  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
              run: |
                  if [ "${{ github.event_name }}" != "pull_request" ]; then
                    echo "payments_affected=true" >> "$GITHUB_OUTPUT"
                    echo "Non-PR event: payments pipeline always runs."
                    exit 0
                  fi
                  affected=$(npx -y turbo@2.10.8 ls --affected --output=json | node -e '
                    let raw = "";
                    process.stdin.on("data", chunk => (raw += chunk));
                    process.stdin.on("end", () => {
                      const names = (JSON.parse(raw).packages?.items ?? []).map(item => item.name);
                      const targets = [
                        "@rnw-community/react-native-payments",
                        "@rnw-community/react-native-payments-example",
                        "@rnw-community/react-native-payments-example-bare",
                        "@rnw-community/react-native-payments-example-expo",
                      ];
                      process.stdout.write(String(names.some(name => targets.includes(name))));
                    });
                  ')
                  echo "payments_affected=${affected}" >> "$GITHUB_OUTPUT"
                  echo "payments_affected=${affected}"

    build:
        name: Build (${{ matrix.target }})
        needs: detect
        if: needs.detect.outputs.payments_affected == 'true'
        runs-on: [self-hosted, linux-tiered, linux-xl]
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                target: [bare, expo]
        env:
            APP_DIR: packages/react-native-payments-example/apps/${{ matrix.target }}

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v5
                with:
                    persist-credentials: false

            -   name: Setup Node
                uses: actions/setup-node@v5
                with:
                    node-version: 22.x
                    cache: yarn

            -   name: Enable corepack
                run: corepack enable

            -   name: Install dependencies
                run: yarn install --immutable

            -   name: Build workspace JS dependencies
                run: yarn build --filter=@rnw-community/react-native-payments

            -   name: Generate native project (expo)
                if: matrix.target == 'expo'
                working-directory: ${{ env.EXAMPLE_DIR }}
                run: yarn prebuild:expo

            -   name: Generate native fingerprint
                id: fingerprint
                working-directory: ${{ env.APP_DIR }}
                run: |
                    set -euo pipefail
                    npx --yes "@expo/fingerprint@${EXPO_FINGERPRINT_VERSION}" fingerprint:generate --platform android > "$RUNNER_TEMP/android-fingerprint-${{ matrix.target }}.json"
                    hash=$(node -e "process.stdout.write(require('$RUNNER_TEMP/android-fingerprint-${{ matrix.target }}.json').hash)")
                    test -n "$hash"
                    echo "hash=$hash" >> "$GITHUB_OUTPUT"
                    echo "Native fingerprint (${{ matrix.target }}): $hash"

            -   name: Restore canonical native app
                id: native-app-cache
                uses: actions/cache/restore@v4
                with:
                    path: .ci-cache/android-native-app/${{ matrix.target }}
                    key: android-native-v1-${{ matrix.target }}-${{ runner.os }}-cmdline-${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}-${{ steps.fingerprint.outputs.hash }}

            # Cache hit means the native shell for this fingerprint is safe to
            # reuse — Gradle assembly is skipped entirely. The fingerprint
            # tracks native surface only, so a hit does not guarantee the
            # embedded JS bundle reflects the current commit's app-layer JS.
            # v1 accepts this gap; the rebundle+repack refinement is
            # documented follow-up (see seed-native-cache.yml header and the
            # matching note in ios-maestro.yml).
            -   name: Report cache hit
                if: steps.native-app-cache.outputs.cache-hit == 'true'
                run: |
                    {
                      echo "### Android build: ${{ matrix.target }} (warm — native build skipped)"
                      echo "Native fingerprint hit; embedded JS bundle dates from when this shell was cached."
                    } >> "$GITHUB_STEP_SUMMARY"

            -   name: Set up Android SDK
                if: steps.native-app-cache.outputs.cache-hit != 'true'
                uses: android-actions/setup-android@v3
                with:
                    cmdline-tools-version: ${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}

            -   name: Restore Gradle cache
                if: steps.native-app-cache.outputs.cache-hit != 'true'
                uses: actions/cache/restore@v4
                with:
                    path: |
                        ~/.gradle/caches
                        ~/.gradle/wrapper
                    key: gradle-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles(format('{0}/android/gradle/wrapper/gradle-wrapper.properties', env.APP_DIR), format('{0}/android/**/*.gradle*', env.APP_DIR), format('{0}/package.json', env.APP_DIR), format('{0}/app.json', env.APP_DIR), 'yarn.lock') }}
                    restore-keys: |
                        gradle-${{ matrix.target }}-${{ runner.os }}-

            -   name: Build APK (Release)
                if: steps.native-app-cache.outputs.cache-hit != 'true'
                working-directory: ${{ env.APP_DIR }}/android
                shell: bash
                run: |
                    set -euo pipefail
                    build_start=$(date +%s)
                    ./gradlew assembleRelease
                    build_end=$(date +%s)
                    {
                      echo "### Android build: ${{ matrix.target }} (cold — native build ran)"
                      echo "Duration: $((build_end - build_start))s"
                    } >> "$GITHUB_STEP_SUMMARY"

            -   name: Save Gradle cache
                if: steps.native-app-cache.outputs.cache-hit != 'true'
                uses: actions/cache/save@v4
                with:
                    path: |
                        ~/.gradle/caches
                        ~/.gradle/wrapper
                    key: gradle-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles(format('{0}/android/gradle/wrapper/gradle-wrapper.properties', env.APP_DIR), format('{0}/android/**/*.gradle*', env.APP_DIR), format('{0}/package.json', env.APP_DIR), format('{0}/app.json', env.APP_DIR), 'yarn.lock') }}

            -   name: Package native app
                if: steps.native-app-cache.outputs.cache-hit != 'true'
                shell: bash
                env:
                    TARGET: ${{ matrix.target }}
                run: |
                    set -euo pipefail
                    apks=()
                    while IFS= read -r apk; do
                      apks+=("$apk")
                    done < <(find "$APP_DIR/android/app/build/outputs/apk/release" \
                               -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' | sort)
                    if [ "${#apks[@]}" -ne 1 ]; then
                      echo "::error::Expected exactly 1 signed release APK, found ${#apks[@]}: ${apks[*]}"
                      exit 1
                    fi
                    apk_path="${apks[0]}"
                    unzip -l "$apk_path" | grep -q 'assets/index.android.bundle'
                    mkdir -p ".ci-cache/android-native-app/$TARGET"
                    cp "$apk_path" ".ci-cache/android-native-app/$TARGET/app-release.apk"

            -   name: Save canonical native app
                if: steps.native-app-cache.outputs.cache-hit != 'true'
                uses: actions/cache/save@v4
                with:
                    path: .ci-cache/android-native-app/${{ matrix.target }}
                    key: android-native-v1-${{ matrix.target }}-${{ runner.os }}-cmdline-${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}-${{ steps.fingerprint.outputs.hash }}

            -   uses: actions/upload-artifact@v4
                with:
                    name: android-e2e-app-${{ matrix.target }}
                    path: .ci-cache/android-native-app/${{ matrix.target }}/app-release.apk
                    retention-days: 1

    test:
        name: Maestro shard ${{ matrix.shard-index }} (${{ matrix.target }})
        needs: [detect, build]
        if: needs.detect.outputs.payments_affected == 'true'
        runs-on: [self-hosted, linux-tiered, linux-xl]
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                target: [bare, expo]
                shard-index: [0, 1]
        env:
            MAESTRO_DEBUG_OUTPUT_DIRECTORY: ${{ github.workspace }}/packages/react-native-payments-example/artifacts/maestro-android-${{ matrix.target }}-${{ matrix.shard-index }}

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v5
                with:
                    persist-credentials: false

            -   name: Resolve target metadata
                id: meta
                run: |
                    case "${{ matrix.target }}" in
                      bare) echo "app_id=com.reactnativepaymentsexample" >> "$GITHUB_OUTPUT" ;;
                      expo) echo "app_id=com.reactnativepaymentsexpoexample" >> "$GITHUB_OUTPUT" ;;
                    esac

            -   uses: actions/download-artifact@v4
                with:
                    name: android-e2e-app-${{ matrix.target }}
                    path: .ci-artifacts/android-e2e-app-${{ matrix.target }}

            -   name: Install Maestro
                run: |
                    maestro_bin="$HOME/.maestro/bin/maestro"
                    if [ ! -x "$maestro_bin" ] || [ "$("$maestro_bin" --version 2>/dev/null | tail -n 1 | tr -d '\r' || true)" != "$MAESTRO_VERSION" ]; then
                      curl -fsSL https://get.maestro.mobile.dev | env MAESTRO_VERSION="$MAESTRO_VERSION" bash
                    fi
                    echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

            -   name: Boot emulator, install app, and run Maestro shard
                uses: reactivecircus/android-emulator-runner@v2.34.0
                with:
                    api-level: 34
                    target: google_apis
                    arch: x86_64
                    profile: pixel_6
                    disable-animations: true
                    disable-spellchecker: true
                    force-avd-creation: false
                    emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                    script: |
                        set -euo pipefail
                        set -x
                        adb wait-for-device
                        timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
                        adb install -r ".ci-artifacts/android-e2e-app-${{ matrix.target }}/app-release.apk"
                        flows=()
                        while IFS= read -r flow; do
                          flows+=("$flow")
                        done < <(find "${{ env.EXAMPLE_DIR }}/e2e/flows" -type f \( -name '*.yaml' -o -name '*.yml' \) | sort)
                        test "${#flows[@]}" -gt 0
                        selected=()
                        for index in "${!flows[@]}"; do
                          if (( index % MAESTRO_SHARD_COUNT == ${{ matrix.shard-index }} )); then
                            selected+=("${flows[$index]}")
                          fi
                        done
                        if [ "${#selected[@]}" -eq 0 ]; then
                          echo "Shard ${{ matrix.shard-index }} has no flows; nothing to run."
                          exit 0
                        fi
                        printf 'Shard ${{ matrix.shard-index }} flows:\n%s\n' "${selected[*]}"
                        maestro test -e "APP_ID=${{ steps.meta.outputs.app_id }}" "${selected[@]}"

            -   name: Capture final device state
                if: always()
                shell: bash
                run: |
                    out="${{ env.MAESTRO_DEBUG_OUTPUT_DIRECTORY }}"
                    mkdir -p "$out"
                    adb exec-out screencap -p > "$out/final-screen.png" || true
                    adb logcat -d > "$out/logcat-full.txt" 2>&1 || true
                    adb logcat -d -b crash > "$out/logcat-crash.txt" 2>&1 || true

            -   name: Shutdown emulator
                if: always()
                run: adb emu kill || true

            -   name: Upload Maestro artifacts
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: maestro-android-${{ matrix.target }}-shard-${{ matrix.shard-index }}
                    path: ${{ env.MAESTRO_DEBUG_OUTPUT_DIRECTORY }}/**
                    if-no-files-found: warn
                    retention-days: 7

    status:
        name: Android Maestro E2E result
        needs: [detect, build, test]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Report
              run: |
                  if [ "${{ needs.detect.result }}" != "success" ]; then
                    echo "Detection job did not succeed."
                    exit 1
                  fi
                  if [ "${{ needs.detect.outputs.payments_affected }}" != "true" ]; then
                    echo "Skipped: payments dependency tree untouched."
                    exit 0
                  fi
                  if [ "${{ needs.build.result }}" != "success" ]; then
                    echo "Build job failed."
                    exit 1
                  fi
                  if [ "${{ needs.test.result }}" != "success" ]; then
                    echo "Maestro suite failed."
                    exit 1
                  fi
                  echo "Maestro suite passed."
