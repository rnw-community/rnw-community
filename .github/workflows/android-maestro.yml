name: Android Maestro E2E

# Runs the Maestro suite of every example package that carries one, on the
# self-hosted Linux fleet (issue #395, epic #372). The package/target matrix comes
# from .github/scripts/maestro-matrix.mjs, which also decides which suites a pull
# request actually needs; add new example packages there, not here.
on:
    workflow_dispatch:
    pull_request:
    push:
        branches: [master]
        paths:
            - packages/react-native-payments/**
            - packages/react-native-payments-example/**
            - packages/react-native-collapsible-header/**
            - packages/react-native-collapsible-header-example/**
            - .github/scripts/maestro-matrix.mjs
            - .github/workflows/android-maestro.yml
    schedule:
        - cron: '47 3 * * *'

concurrency:
    group: android-maestro-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    MAESTRO_VERSION: '2.8.0'
    MAESTRO_CLI_NO_ANALYTICS: true
    MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: true
    YARN_ENABLE_IMMUTABLE_INSTALLS: true

jobs:
    detect:
        name: Detect affected packages
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.affected.outputs.matrix }}
            any: ${{ steps.affected.outputs.any }}
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@v5
              with:
                  node-version: 22.x
            - name: Compute affected example packages
              id: affected
              env:
                  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
                  EVENT_NAME: ${{ github.event_name }}
              run: |
                  set -euo pipefail
                  # An empty file means "not a pull request", where every suite runs.
                  : > affected.json
                  if [ "$EVENT_NAME" = "pull_request" ]; then
                    npx -y turbo@2.10.8 ls --affected --output=json > affected.json
                  fi
                  node .github/scripts/maestro-matrix.mjs affected.json | tee -a "$GITHUB_OUTPUT"
    maestro:
        name: Maestro (${{ matrix.package }}, ${{ matrix.target }})
        needs: detect
        if: needs.detect.outputs.any == 'true'
        runs-on: [self-hosted, linux-tiered, linux-xl]
        # Self-hosted fleet capacity is shared with other repositories, so both the
        # job and every step below carry an explicit bound. See the step comments
        # for how each number was sized.
        timeout-minutes: 65
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.detect.outputs.matrix) }}
        env:
            APP_DIR: ${{ matrix.example_dir }}/apps/${{ matrix.target }}
            MAESTRO_DEBUG_OUTPUT_DIRECTORY: ${{ github.workspace }}/${{ matrix.example_dir }}/artifacts/maestro-android-${{ matrix.package }}-${{ matrix.target }}
            # Several legs can land on the same self-hosted host, so the container
            # name is per-leg. The data directory and adb port are derived inside the
            # redroid step: job-level env cannot read the runner context, and docker
            # assigns the port.
            REDROID_CONTAINER: redroid-${{ matrix.package }}-${{ matrix.target }}-${{ github.run_id }}

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v5
                timeout-minutes: 10

            -   name: Setup Node
                uses: actions/setup-node@v5
                timeout-minutes: 10
                with:
                    node-version: 22.x
                    cache: yarn

            -   name: Enable corepack
                timeout-minutes: 5
                run: corepack enable

            -   name: Install dependencies
                timeout-minutes: 15
                run: yarn install --immutable

            -   name: Build workspace JS dependencies
                timeout-minutes: 10
                run: yarn build --filter=${{ matrix.build_filter }}

            -   name: Generate native project (expo)
                if: matrix.target == 'expo'
                timeout-minutes: 10
                working-directory: ${{ matrix.example_dir }}
                run: yarn prebuild:expo

            -   name: Set up Android SDK
                uses: android-actions/setup-android@v3
                timeout-minutes: 15
                with:
                    # The action still defaults to "tools platform-tools", but the
                    # obsolete "tools" package was withdrawn from the Google SDK
                    # repository, so sdkmanager exits 1 with "Dependant package with
                    # key emulator not found!". Gradle resolves the build tools and
                    # platform it needs on its own, so platform-tools is the only
                    # package this workflow has to request.
                    packages: platform-tools

            -   name: Provide a host-architecture adb
                # Google ships platform-tools for linux-x86_64 only. On the arm64
                # fleet its adb cannot exec at all — the shell falls back to parsing
                # the ELF as a script and reports "Syntax error: word unexpected" —
                # so the distro adb replaces it for every consumer (Gradle, Maestro,
                # the steps below) through the path the SDK already exports.
                timeout-minutes: 10
                run: |
                    set -euo pipefail
                    if ! dpkg -s adb >/dev/null 2>&1; then
                      sudo apt-get update -y
                      sudo apt-get install -y adb
                    fi
                    sudo ln -sf /usr/bin/adb "$ANDROID_HOME/platform-tools/adb"
                    adb version

            -   name: Start redroid container
                id: redroid
                # redroid runs Android on the host kernel instead of emulating a
                # foreign architecture, so it needs neither KVM nor an x86_64 host —
                # the two things this arm64 fleet cannot offer. The image is
                # multi-arch, so the arm64 host pulls an arm64 Android whose ABI
                # matches the arm64-v8a slice of the release APK.
                timeout-minutes: 15
                run: |
                    set -euo pipefail
                    if [ ! -d /dev/binderfs ] && ! lsmod | grep -q '^binder_linux'; then
                      echo "::error::redroid needs binder on the host. Load it on the runner: sudo modprobe binder_linux devices=binder,hwbinder,vndbinder"
                      exit 1
                    fi
                    # Every wait below can only fail as a timeout, which says nothing
                    # about why Android did not come up. The container's own log does,
                    # and so does whether this host's docker is rootless — under
                    # rootless docker `--privileged` grants nothing, redroid cannot
                    # mount binderfs, and the container stays up while adbd never
                    # listens, which looks exactly like a slow boot.
                    dump_redroid_state() {
                      echo "::group::redroid diagnostics"
                      docker info --format 'security options: {{.SecurityOptions}}' || true
                      docker ps -a --filter "name=$REDROID_CONTAINER" --format '{{.Names}}: {{.Status}}' || true
                      docker logs --tail 200 "$REDROID_CONTAINER" 2>&1 || true
                      echo "::endgroup::"
                    }
                    trap dump_redroid_state ERR
                    docker rm -f "$REDROID_CONTAINER" >/dev/null 2>&1 || true
                    REDROID_DATA_DIR="$RUNNER_TEMP/$REDROID_CONTAINER"
                    echo "REDROID_DATA_DIR=$REDROID_DATA_DIR" >> "$GITHUB_ENV"
                    rm -rf "$REDROID_DATA_DIR"
                    mkdir -p "$REDROID_DATA_DIR"
                    # An unbounded container took every runner down with "the self-hosted
                    # runner lost communication with the server" — the runner agent has to
                    # keep reporting while Android boots, and in guest GPU mode that boot
                    # is pure CPU work, so the container is held to all but two cores and
                    # a memory ceiling. The pixel count is cut for the same reason: nothing
                    # in the suite depends on it, every gesture is expressed in percentages.
                    container_cpus=$(( $(nproc) > 3 ? $(nproc) - 2 : 1 ))
                    echo "host cores: $(nproc); container limited to ${container_cpus}"
                    docker run -d --privileged \
                      --name "$REDROID_CONTAINER" \
                      --cpus "$container_cpus" \
                      --memory 6g \
                      -p 127.0.0.1::5555 \
                      -v "$REDROID_DATA_DIR:/data" \
                      redroid/redroid:14.0.0-latest \
                      androidboot.redroid_width=720 \
                      androidboot.redroid_height=1600 \
                      androidboot.redroid_dpi=320 \
                      androidboot.redroid_fps=30 \
                      androidboot.redroid_gpu_mode=guest
                    # The export is load-bearing: the wait loops below run in a child
                    # `bash -c`, whose single quotes defer expansion to that child, and
                    # $GITHUB_ENV only reaches later steps. Unexported, the child saw an
                    # empty port and polled `adb connect 127.0.0.1:` until the timeout —
                    # a 124 that read as "redroid never booted" while it had booted fine.
                    export ADB_PORT
                    ADB_PORT=$(docker port "$REDROID_CONTAINER" 5555/tcp | head -1 | sed 's/.*://')
                    test -n "$ADB_PORT"
                    echo "ADB_PORT=$ADB_PORT" >> "$GITHUB_ENV"
                    adb start-server
                    timeout 180 bash -c 'until adb connect "127.0.0.1:$ADB_PORT" | grep -q connected; do sleep 3; done'
                    timeout 300 adb -s "127.0.0.1:$ADB_PORT" wait-for-device
                    # A killed runner uploads no log at all, so the boot narrates itself
                    # into the live stream as it goes: load average beside the boot
                    # properties is what separates "starved" from "stuck".
                    device="127.0.0.1:$ADB_PORT"
                    export device
                    timeout 300 bash -c 'until [ "$(adb -s "$device" shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do
                      echo "booting: bootanim=$(adb -s "$device" shell getprop init.svc.bootanim | tr -d "\r") load=$(cut -d" " -f1-3 /proc/loadavg)"
                      sleep 10
                    done'
                    adb devices -l

            -   name: Restore Gradle cache
                uses: actions/cache@v4
                timeout-minutes: 10
                with:
                    path: |
                        ~/.gradle/caches
                        ~/.gradle/wrapper
                    key: gradle-${{ matrix.package }}-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles(format('{0}/android/gradle/wrapper/gradle-wrapper.properties', env.APP_DIR), format('{0}/android/**/*.gradle*', env.APP_DIR), format('{0}/package.json', env.APP_DIR), format('{0}/app.json', env.APP_DIR), 'yarn.lock') }}
                    restore-keys: |
                        gradle-${{ matrix.package }}-${{ matrix.target }}-${{ runner.os }}-

            -   name: Install Maestro
                timeout-minutes: 10
                run: |
                    maestro_bin="$HOME/.maestro/bin/maestro"
                    if [ -x "$maestro_bin" ] && [ "$("$maestro_bin" --version 2>/dev/null | tail -n 1 | tr -d '\r' || true)" = "$MAESTRO_VERSION" ]; then
                      echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
                      exit 0
                    fi
                    # Some hosts in the self-hosted fleet carry a package-manager-managed
                    # maestro. get.maestro.mobile.dev refuses to install beside one and
                    # exits 1, which failed the job before a single flow ran, so an
                    # already-provisioned maestro is used as it is (version logged, and
                    # left on the PATH the runner already exports).
                    if command -v maestro >/dev/null 2>&1; then
                      echo "Using the maestro already provisioned on this host:"
                      maestro --version
                      exit 0
                    fi
                    curl -fsSL https://get.maestro.mobile.dev | env MAESTRO_VERSION="$MAESTRO_VERSION" bash
                    echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

            -   name: Build, install, and test
                id: emulator
                # A cold Gradle release build plus the Maestro suite. redroid is
                # already booted by the previous step, so this budget is build and
                # test only, leaving the rest of the 65 minute job budget for setup.
                timeout-minutes: 45
                shell: bash
                run: |
                    set -euo pipefail
                    set -x
                    (cd "${{ env.APP_DIR }}/android" && ./gradlew assembleRelease)
                    apk=$(find "${{ env.APP_DIR }}/android/app/build/outputs/apk/release" -name '*.apk' | head -1)
                    timeout 300 adb -s "127.0.0.1:$ADB_PORT" install -r "$apk"
                    cd "${{ matrix.example_dir }}"
                    yarn e2e:android:${{ matrix.target }}

            -   name: Capture final device state
                # Only meaningful when the redroid container booted and the test step
                # then failed. If setup failed earlier, this is skipped instead of
                # talking to an adb server that has no device.
                if: failure() && (steps.emulator.outcome == 'failure' || steps.redroid.outcome == 'failure')
                # A diagnostic must never outlive the test it is diagnosing.
                timeout-minutes: 3
                shell: bash
                run: |
                    out="${{ env.MAESTRO_DEBUG_OUTPUT_DIRECTORY }}"
                    mkdir -p "$out"
                    docker logs "$REDROID_CONTAINER" > "$out/redroid-container.log" 2>&1 || true
                    if ! timeout 30 adb -s "127.0.0.1:$ADB_PORT" wait-for-device; then
                      echo "No device attached after 30s; skipping device state capture."
                      exit 0
                    fi
                    device="127.0.0.1:$ADB_PORT"
                    timeout 30 adb -s "$device" exec-out screencap -p > "$out/final-screen.png" || true
                    timeout 60 adb -s "$device" logcat -d > "$out/logcat-full.txt" 2>&1 || true
                    timeout 30 adb -s "$device" logcat -d -b crash > "$out/logcat-crash.txt" 2>&1 || true

            -   name: Stop redroid container
                # The fleet is shared, so a leaked privileged container (and its data
                # directory) must never outlive the job that started it.
                if: always()
                timeout-minutes: 5
                shell: bash
                run: |
                    adb disconnect "127.0.0.1:${ADB_PORT:-0}" || true
                    docker rm -f "$REDROID_CONTAINER" || true
                    if [ -n "${REDROID_DATA_DIR:-}" ]; then rm -rf "$REDROID_DATA_DIR" || true; fi

            -   name: Upload Maestro artifacts
                # Matches the capture step's condition — gating this on the test step
                # alone discarded the container log whenever setup was what failed.
                if: failure() && (steps.emulator.outcome == 'failure' || steps.redroid.outcome == 'failure')
                uses: actions/upload-artifact@v4
                timeout-minutes: 5
                with:
                    name: maestro-android-${{ matrix.package }}-${{ matrix.target }}
                    path: ${{ env.MAESTRO_DEBUG_OUTPUT_DIRECTORY }}/**
                    if-no-files-found: warn
                    retention-days: 7

    status:
        name: Android Maestro E2E result
        needs: [detect, maestro]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Report
              run: |
                  if [ "${{ needs.detect.result }}" != "success" ]; then
                    echo "Detection job did not succeed."
                    exit 1
                  fi
                  if [ "${{ needs.detect.outputs.any }}" != "true" ]; then
                    echo "Skipped: no example package dependency tree was touched."
                    exit 0
                  fi
                  if [ "${{ needs.maestro.result }}" != "success" ]; then
                    echo "Maestro suite failed."
                    exit 1
                  fi
                  echo "Maestro suite passed."
