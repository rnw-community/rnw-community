name: Android Maestro E2E

# Thin caller of rnw-community/mobile-ci's android-maestro.yml: one call runs
# every example package's suite, each target with its own flowsDir, on a
# KVM-accelerated Google APIs emulator. Bare apps cannot be repacked, so they
# always build natively.
on:
    workflow_dispatch:
    pull_request:
    push:
        branches: [master]
        paths:
            - packages/react-native-payments/**
            - packages/react-native-payments-example/**
            - packages/react-native-collapsible-header/**
            - packages/react-native-collapsible-header-example/**
            - .github/workflows/android-maestro.yml
    schedule:
        - cron: '47 3 * * *'

permissions: {}

jobs:
    e2e:
        permissions:
            contents: read
            packages: write
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/android-maestro.yml@c45b9b0e1cc8e841a9d1f1df5f8a9acaa422ce19 # v4.3.1
        with:
            targets: >-
                [
                  {"name":"payments-bare","appDir":"packages/react-native-payments-example/apps/bare","appId":"com.reactnativepaymentsexample","prebuildCommand":"","flowsDir":"packages/react-native-payments-example/e2e/flows","buildStrategy":"native"},
                  {"name":"payments-expo","appDir":"packages/react-native-payments-example/apps/expo","appId":"com.reactnativepaymentsexpoexample","prebuildCommand":"pnpm prebuild","flowsDir":"packages/react-native-payments-example/e2e/flows"},
                  {"name":"collapsible-header-bare","appDir":"packages/react-native-collapsible-header-example/apps/bare","appId":"com.reactnativecollapsibleheaderexample","prebuildCommand":"","flowsDir":"packages/react-native-collapsible-header-example/e2e/flows","buildStrategy":"native"},
                  {"name":"collapsible-header-expo","appDir":"packages/react-native-collapsible-header-example/apps/expo","appId":"com.reactnativecollapsibleheaderexpoexample","prebuildCommand":"pnpm prebuild","flowsDir":"packages/react-native-collapsible-header-example/e2e/flows"},
                  {"name":"screen-chrome-bare","appDir":"packages/react-native-screen-chrome-example/apps/bare","appId":"com.reactnativescreenchromeexample","prebuildCommand":"","flowsDir":"packages/react-native-screen-chrome-example/e2e/flows","buildStrategy":"native"},
                  {"name":"screen-chrome-expo","appDir":"packages/react-native-screen-chrome-example/apps/expo","appId":"com.reactnativescreenchromeexpoexample","prebuildCommand":"pnpm prebuild","flowsDir":"packages/react-native-screen-chrome-example/e2e/flows"}
                ]
            flows-name-pattern: '*.yaml'
            install-command: pnpm install --frozen-lockfile
            build-command: pnpm build --filter=...@rnw-community/react-native-payments-example-bare --filter=...@rnw-community/react-native-payments-example-expo --filter=...@rnw-community/react-native-collapsible-header-example-bare --filter=...@rnw-community/react-native-collapsible-header-example-expo --filter=...@rnw-community/react-native-screen-chrome-example-bare --filter=...@rnw-community/react-native-screen-chrome-example-expo
            exempt-paths: |
                **/*.md
                **/llms*.txt
                **/docs/**
            trigger-paths: |
                .github/workflows/ios-maestro.yml
                .github/workflows/android-maestro.yml
            maestro-version: '2.8.0'
            build-timeout-minutes: 120
            # 720x1280 @ 320dpi, the viewport every flow's swipe percentages are calibrated against.
            emulator-profile: Galaxy Nexus
            emulator-slots-dir: /var/lib/mobile-ci/emulator-slots

    # See ios-maestro.yml: the same edge-fade harness gate on the Android emulator.
    edge-fade-harness:
        permissions:
            contents: read
            packages: write
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/android-maestro.yml@c45b9b0e1cc8e841a9d1f1df5f8a9acaa422ce19 # v4.3.1
        with:
            call-scope: edge-fade
            targets: >-
                [
                  {"name":"screen-chrome-harness","appDir":"packages/react-native-screen-chrome-example/apps/expo","appId":"com.reactnativescreenchromeexpoexample","prebuildCommand":"pnpm prebuild","flowsDir":"packages/react-native-screen-chrome-example/e2e/harness"}
                ]
            flows-name-pattern: '*.yaml'
            pre-flow-command: |
                dest="${ARTIFACTS_DIR:-$MAESTRO_DEBUG_OUTPUT_DIRECTORY}/edge-fade"
                mkdir -p "$dest"
                nohup bash -c 'while sleep 1; do find "$RUNNER_TEMP" -path "*/maestro-debug-*/takeScreenshot/edge-fade/*.png" -exec cp -f {} "$0" \; 2>/dev/null; done' "$dest" >/dev/null 2>&1 &
            install-command: pnpm install --frozen-lockfile
            build-command: pnpm build --filter=...@rnw-community/react-native-screen-chrome-example-expo
            exempt-paths: |
                **/*.md
                **/llms*.txt
                **/docs/**
            trigger-paths: |
                .github/workflows/android-maestro.yml
            maestro-version: '2.8.0'
            build-timeout-minutes: 120
            emulator-profile: Galaxy Nexus
            emulator-slots-dir: /var/lib/mobile-ci/emulator-slots

    edge-fade-metrics:
        name: Edge-fade harness (Android)
        needs: edge-fade-harness
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            actions: read
        env:
            HARNESS_RESULT: ${{ needs.edge-fade-harness.outputs.result }}
        steps:
            - name: Require the harness run
              run: |
                  echo "harness=${HARNESS_RESULT:-missing}"
                  case "$HARNESS_RESULT" in passed|skipped) ;; *) exit 1 ;; esac

            - name: Checkout repository
              if: env.HARNESS_RESULT == 'passed'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              if: env.HARNESS_RESULT == 'passed'
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

            - name: Setup Node
              if: env.HARNESS_RESULT == 'passed'
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.x
                  cache: pnpm

            - name: Install the metric script dependencies
              if: env.HARNESS_RESULT == 'passed'
              run: pnpm install --frozen-lockfile --filter @rnw-community/react-native-screen-chrome-example

            - name: Download the harness captures
              if: env.HARNESS_RESULT == 'passed'
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: maestro-android*screen-chrome-harness-shard-*
                  path: harness
                  merge-multiple: true

            - name: Measure the edge-fade blur
              if: env.HARNESS_RESULT == 'passed'
              run: node packages/react-native-screen-chrome-example/e2e/harness/edge-fade-metrics.mjs harness/edge-fade packages/react-native-screen-chrome-example/e2e/harness/baselines/android
