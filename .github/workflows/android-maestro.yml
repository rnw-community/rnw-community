name: Android Maestro E2E

# Draft workflow for issue #395 (react-native-payments revival, epic #372),
# canary-optimized per issue #447: fingerprinted native-app cache seeded by
# seed-native-cache.yml plus a build/test split with Maestro shards.
#
# Build (native APK) runs on the self-hosted macOS fleet (macos-maestro), not
# a Linux runner: Google does not publish linux-aarch64 builds of the Android
# SDK's cmake, NDK toolchain, or emulator packages (confirmed against this
# fleet's actual runner and Google's own issue tracker,
# issuetracker.google.com/issues/397407933) — sdkmanager silently installs
# the x86_64 Linux binaries regardless of host arch, and executing them on
# this fleet's linux-aarch64 runners fails at the kernel level (surfaces as a
# shell "Syntax error" from the exec-format mismatch, not a clean error
# message). The Android NDK's "darwin-x86_64" toolchain, despite the name,
# ships as a universal (fat) Mach-O binary that runs natively on Apple
# Silicon, so the identical native-build step that is structurally broken on
# linux-aarch64 works unmodified here.
#
# Test (Maestro execution) runs on the self-hosted Linux fleet
# ([self-hosted, linux-tiered, linux-xl]) via Redroid — Android-in-a-
# privileged-container over the binder_linux kernel module — instead of an
# AVD emulator. This sidesteps the gap above entirely rather than working
# around it: Redroid needs no sdkmanager, no NDK, no emulator binary on the
# runner at all, just a prewarmed container image and the host's binder
# module, so the linux-aarch64 block above never applies to this job. The
# container-bring-up plumbing (docker run --privileged, adb connect,
# boot-completed wait, APK install) is adapted from a sister project's
# android-maestro.yml, whose own Maestro suite has since gone green there
# (element-not-found failures traced to app-level selector/animation races
# under Redroid's guest GPU mode, not the container plumbing itself) — the
# fixes that got it green (a redroid tag verified against the host kernel
# instead of one that never finishes boot, and forcing all three animation
# scales to 0 so no flow assertion can race a transition) are folded into
# this job's own steps below. Keeps the macOS fleet free for iOS-only
# Maestro; Android build
# still cross-compiles on macOS (build job, unchanged) since the NDK/cmake
# gap above is a build-time problem this job never touches. The linux-xl
# runner image may optionally carry a Redroid prewarm (docker + a pulled
# arm64 redroid/redroid image + a prewarmed /data volume, manifest at
# $HOME/.rnw-ci/android-emulator.json) for fast, warm shard starts; the
# "Start prewarmed Redroid container" step falls back to an in-workflow
# `docker pull` of a pinned default image plus a fresh $RUNNER_TEMP data dir
# when that manifest is absent, so a fleet lacking the prewarm degrades to a
# slower cold start instead of hard-failing every shard. The one thing that
# step cannot self-heal is the binder_linux kernel module itself (host-kernel
# provisioning, not something a job can safely install unattended) — it
# modprobes and then verifies /dev/binder et al. actually exist, failing with
# a clear, actionable error if the host genuinely lacks binder support.
on:
    workflow_dispatch:
    pull_request:
    push:
        branches: [master]
        paths:
            - packages/react-native-payments/**
            - packages/react-native-payments-example/**
            - yarn.lock
            - package.json
            - .github/workflows/android-maestro.yml
    schedule:
        - cron: '47 3 * * *'

concurrency:
    group: android-maestro-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    MAESTRO_VERSION: '2.8.0'
    MAESTRO_CLI_NO_ANALYTICS: true
    MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: true
    MAESTRO_SHARD_COUNT: '2'
    EXPO_FINGERPRINT_VERSION: '0.20.6'
    ANDROID_CMDLINE_TOOLS_VERSION: '12266719'
    YARN_ENABLE_IMMUTABLE_INSTALLS: true
    EXAMPLE_DIR: packages/react-native-payments-example

jobs:
    detect:
        name: Detect affected packages
        runs-on: ubuntu-latest
        outputs:
            payments_affected: ${{ steps.affected.outputs.payments_affected }}
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@v5
              with:
                  node-version: 22.x
            - name: Compute affected packages
              id: affected
              env:
                  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
              run: |
                  if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
                    echo "payments_affected=true" >> "$GITHUB_OUTPUT"
                    echo "Non-PR event: payments pipeline always runs."
                    exit 0
                  fi
                  affected=$(npx -y turbo@2.10.8 ls --affected --output=json | node -e '
                    let raw = "";
                    process.stdin.on("data", chunk => (raw += chunk));
                    process.stdin.on("end", () => {
                      const names = (JSON.parse(raw).packages?.items ?? []).map(item => item.name);
                      const targets = [
                        "@rnw-community/react-native-payments",
                        "@rnw-community/react-native-payments-example",
                        "@rnw-community/react-native-payments-example-bare",
                        "@rnw-community/react-native-payments-example-expo",
                      ];
                      process.stdout.write(String(names.some(name => targets.includes(name))));
                    });
                  ')
                  echo "payments_affected=${affected}" >> "$GITHUB_OUTPUT"
                  echo "payments_affected=${affected}"

    build:
        name: Build (${{ matrix.target }})
        needs: detect
        if: needs.detect.outputs.payments_affected == 'true'
        runs-on: [self-hosted, macOS, ARM64, macos-maestro]
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                target: [bare, expo]
        env:
            APP_DIR: packages/react-native-payments-example/apps/${{ matrix.target }}

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v5
                with:
                    persist-credentials: false

            -   name: Setup Node
                uses: actions/setup-node@v5
                with:
                    node-version: 22.x
                    cache: yarn

            -   name: Enable corepack
                run: corepack enable

            -   name: Install dependencies
                run: yarn install --immutable

            -   name: Build workspace JS dependencies
                run: yarn build --filter=@rnw-community/react-native-payments

            -   name: Generate native project (expo)
                if: matrix.target == 'expo'
                working-directory: ${{ env.EXAMPLE_DIR }}
                run: yarn prebuild:expo

            -   name: Generate native fingerprint
                id: fingerprint
                working-directory: ${{ env.APP_DIR }}
                env:
                    TARGET: ${{ matrix.target }}
                run: |
                    set -euo pipefail
                    fingerprint_file="$RUNNER_TEMP/android-fingerprint-$TARGET.json"
                    npx --yes "@expo/fingerprint@${EXPO_FINGERPRINT_VERSION}" fingerprint:generate --platform android > "$fingerprint_file"
                    hash=$(node -e "process.stdout.write(require(process.argv[1]).hash)" "$fingerprint_file")
                    test -n "$hash"
                    echo "hash=$hash" >> "$GITHUB_OUTPUT"
                    echo "Native fingerprint ($TARGET): $hash"

            -   name: Restore canonical native app
                id: native-app-cache
                uses: actions/cache/restore@v4
                with:
                    path: .ci-cache/android-native-app/${{ matrix.target }}
                    key: android-native-v1-${{ matrix.target }}-${{ runner.os }}-cmdline-${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}-${{ steps.fingerprint.outputs.hash }}

            # Cache hit means the native shell for this fingerprint is safe to
            # reuse — Gradle assembly is skipped entirely. The fingerprint
            # tracks native surface only, so a hit does not guarantee the
            # embedded JS bundle reflects the current commit's app-layer JS.
            # v1 accepts this gap; the rebundle+repack refinement is
            # documented follow-up (see seed-native-cache.yml header and the
            # matching note in ios-maestro.yml).
            -   name: Report cache hit
                if: steps.native-app-cache.outputs.cache-hit == 'true'
                env:
                    TARGET: ${{ matrix.target }}
                run: |
                    {
                      echo "### Android build: $TARGET (warm — native build skipped)"
                      echo "Native fingerprint hit; embedded JS bundle dates from when this shell was cached."
                    } >> "$GITHUB_STEP_SUMMARY"

            # accept-android-sdk-licenses is disabled here because the action's
            # own "sdkmanager --licenses" call walks the dependency graph of
            # the *entire* remote repository listing, unscoped to the
            # packages this workflow actually needs — including legacy,
            # deprecated packages this workflow never touches. Pre-seeding
            # the two publicly documented license hashes below satisfies
            # every consumer (this step's own `packages` install and Gradle)
            # without ever invoking that unscoped walk, on any host platform.
            # The `test` job below no longer needs an SDK at all — it runs
            # Maestro against a Redroid container, not an AVD emulator.
            -   name: Set up Android SDK
                if: steps.native-app-cache.outputs.cache-hit != 'true'
                uses: android-actions/setup-android@v3
                with:
                    cmdline-tools-version: ${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}
                    accept-android-sdk-licenses: false
                    packages: platform-tools

            -   name: Accept Android SDK licenses
                if: steps.native-app-cache.outputs.cache-hit != 'true'
                run: |
                    set -euo pipefail
                    mkdir -p "$ANDROID_HOME/licenses"
                    printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$ANDROID_HOME/licenses/android-sdk-license"
                    printf '84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"

            -   name: Setup JDK
                if: steps.native-app-cache.outputs.cache-hit != 'true'
                uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: '17'

            -   name: Restore Gradle cache
                if: steps.native-app-cache.outputs.cache-hit != 'true'
                uses: actions/cache/restore@v4
                with:
                    path: |
                        ~/.gradle/caches
                        ~/.gradle/wrapper
                    key: gradle-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles(format('{0}/android/gradle/wrapper/gradle-wrapper.properties', env.APP_DIR), format('{0}/android/**/*.gradle*', env.APP_DIR), format('{0}/package.json', env.APP_DIR), format('{0}/app.json', env.APP_DIR), 'yarn.lock') }}
                    restore-keys: |
                        gradle-${{ matrix.target }}-${{ runner.os }}-

            -   name: Build APK (Release)
                if: steps.native-app-cache.outputs.cache-hit != 'true'
                working-directory: ${{ env.APP_DIR }}/android
                shell: bash
                env:
                    TARGET: ${{ matrix.target }}
                run: |
                    set -euo pipefail
                    build_start=$(date +%s)
                    ./gradlew assembleRelease
                    build_end=$(date +%s)
                    {
                      echo "### Android build: $TARGET (cold — native build ran)"
                      echo "Duration: $((build_end - build_start))s"
                    } >> "$GITHUB_STEP_SUMMARY"

            -   name: Diagnose NDK/cmake host architecture
                if: always() && steps.native-app-cache.outputs.cache-hit != 'true'
                env:
                    TARGET: ${{ matrix.target }}
                run: |
                    {
                      echo "### NDK/cmake host arch diagnostic ($TARGET)"
                      echo '```'
                      echo "uname -m: $(uname -m)"
                      echo "--- cmake binaries under ANDROID_HOME/cmake ---"
                      find "$ANDROID_HOME/cmake" -type f -perm -u+x -iname 'cmake' 2>/dev/null | while read -r bin; do
                        echo "$bin: $(file -b "$bin" 2>/dev/null || echo 'file unavailable')"
                      done
                      echo "--- ANDROID_HOME/ndk/*/toolchains/llvm/prebuilt listing ---"
                      find "$ANDROID_HOME/ndk" -maxdepth 4 -type d -path '*/toolchains/llvm/prebuilt' 2>/dev/null | while read -r d; do
                        echo "$d:"; ls -1 "$d" 2>/dev/null
                      done
                      echo '```'
                    } >> "$GITHUB_STEP_SUMMARY"

            -   name: Save Gradle cache
                if: steps.native-app-cache.outputs.cache-hit != 'true'
                uses: actions/cache/save@v4
                with:
                    path: |
                        ~/.gradle/caches
                        ~/.gradle/wrapper
                    key: gradle-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles(format('{0}/android/gradle/wrapper/gradle-wrapper.properties', env.APP_DIR), format('{0}/android/**/*.gradle*', env.APP_DIR), format('{0}/package.json', env.APP_DIR), format('{0}/app.json', env.APP_DIR), 'yarn.lock') }}

            -   name: Package native app
                if: steps.native-app-cache.outputs.cache-hit != 'true'
                shell: bash
                env:
                    TARGET: ${{ matrix.target }}
                run: |
                    set -euo pipefail
                    apks=()
                    while IFS= read -r apk; do
                      apks+=("$apk")
                    done < <(find "$APP_DIR/android/app/build/outputs/apk/release" \
                               -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' | sort)
                    if [ "${#apks[@]}" -ne 1 ]; then
                      echo "::error::Expected exactly 1 signed release APK, found ${#apks[@]}: ${apks[*]}"
                      exit 1
                    fi
                    apk_path="${apks[0]}"
                    apk_listing=$(unzip -l "$apk_path")
                    grep -q 'assets/index.android.bundle' <<< "$apk_listing"
                    mkdir -p ".ci-cache/android-native-app/$TARGET"
                    cp "$apk_path" ".ci-cache/android-native-app/$TARGET/app-release.apk"
                    mkdir -p "ci-artifacts/android-e2e-app-$TARGET"
                    cp "$apk_path" "ci-artifacts/android-e2e-app-$TARGET/app-release.apk"

            -   name: Save canonical native app
                if: steps.native-app-cache.outputs.cache-hit != 'true'
                uses: actions/cache/save@v4
                with:
                    path: .ci-cache/android-native-app/${{ matrix.target }}
                    key: android-native-v1-${{ matrix.target }}-${{ runner.os }}-cmdline-${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}-${{ steps.fingerprint.outputs.hash }}

            # "Package native app" (the step that stages ci-artifacts/) only runs
            # on a cache miss. Stage the restored cache-hit APK the same way here
            # so the unconditional upload-artifact step below always finds one.
            -   name: Stage native app for upload (cache hit)
                if: steps.native-app-cache.outputs.cache-hit == 'true'
                shell: bash
                env:
                    TARGET: ${{ matrix.target }}
                run: |
                    set -euo pipefail
                    mkdir -p "ci-artifacts/android-e2e-app-$TARGET"
                    cp ".ci-cache/android-native-app/$TARGET/app-release.apk" "ci-artifacts/android-e2e-app-$TARGET/app-release.apk"

            -   uses: actions/upload-artifact@v4
                with:
                    name: android-e2e-app-${{ matrix.target }}
                    path: ci-artifacts/android-e2e-app-${{ matrix.target }}/app-release.apk
                    retention-days: 1

    test:
        name: Maestro shard ${{ matrix.shard-index }} (${{ matrix.target }})
        needs: [detect, build]
        if: needs.detect.outputs.payments_affected == 'true'
        runs-on: [self-hosted, linux-tiered, linux-xl]
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                target: [bare, expo]
                shard-index: [0, 1]
        env:
            MAESTRO_DEBUG_OUTPUT_DIRECTORY: ${{ github.workspace }}/packages/react-native-payments-example/artifacts/maestro-android-${{ matrix.target }}-${{ matrix.shard-index }}

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v5
                with:
                    persist-credentials: false

            # 4 shard cells (2 targets x 2 shard-index) can land on the same
            # linux-xl host concurrently — unlike the sister repo's single,
            # unsharded job, so its fixed container name/adb port would
            # collide here. A name unique only within this run isn't enough
            # either: this fleet can run more than one workflow run on the
            # same host pool at once, and two concurrent runs would still
            # compute the identical name for the same cell. Fold
            # github.run_id/run_attempt into the container name so no two
            # runs, concurrent or not, ever collide. The adb port needs no
            # equivalent scoping: the container publishes 5555 on loopback
            # with an OS-assigned ephemeral host port instead of a port this
            # workflow picks itself, so the kernel guarantees it every time.
            -   name: Resolve target metadata
                id: meta
                env:
                    TARGET: ${{ matrix.target }}
                    SHARD_INDEX: ${{ matrix.shard-index }}
                run: |
                    set -euo pipefail
                    case "$TARGET" in
                      bare) echo "app_id=com.reactnativepaymentsexample" >> "$GITHUB_OUTPUT" ;;
                      expo) echo "app_id=com.reactnativepaymentsexpoexample" >> "$GITHUB_OUTPUT" ;;
                    esac
                    container_name="redroid-e2e-${TARGET}-${SHARD_INDEX}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                    # container_name reaches sudo rm -rf by way of a
                    # constructed data-dir path in the next step; validate it
                    # here too (defense in depth — never trust a value to
                    # still be what an earlier step checked once it crosses a
                    # step boundary).
                    case "$container_name" in
                      ''|.|..)
                        echo "::error::Invalid computed container name."
                        exit 1
                        ;;
                      *[!A-Za-z0-9_.-]*)
                        echo "::error::Invalid computed container name '$container_name': only [A-Za-z0-9_.-] characters are allowed."
                        exit 1
                        ;;
                    esac
                    echo "container_name=$container_name" >> "$GITHUB_OUTPUT"

            # Ported from the sister sudoku-game repo's android-maestro.yml:
            # container boot, adb connect, and the boot-completed wait were
            # verified reliable there across several runs (only that repo's
            # own Maestro flow assertions were failing, not this bring-up).
            # --memory/--cpus below are halved from that repo's single-job
            # 6g/4cpu request (to 3g/2cpu) since up to 4 of these run
            # concurrently on one linux-xl host here versus their 1 — revisit
            # once real contention on this runner pool is observed.
            #
            # A missing prewarm manifest no longer hard-fails the shard: it
            # falls back to a pinned default image and an on-the-fly data dir
            # under $RUNNER_TEMP, paying for a cold `docker pull` (bounded by
            # a generous timeout) and a cold Android first boot instead. The
            # binder_linux kernel module is the one dependency that fallback
            # cannot paper over — modprobe is attempted, then verified by
            # checking for the device nodes it is asked to create, and a
            # missing module fails the shard with an explicit, actionable
            # error rather than proceeding into a `docker run` that would
            # only fail later with a far more confusing symptom.
            -   name: Start prewarmed Redroid container
                id: redroid
                shell: bash
                timeout-minutes: 25
                env:
                    # 13.0.0 never finishes boot and 14.x hard-locks the guest kernel
                    # version on the sister repo's identical Redroid setup; 15.0.0_64only
                    # is that repo's verified-good tag against a 6.17 host kernel. Use the
                    # same pin here so a cold-start fallback (no prewarm manifest) doesn't
                    # risk trading a slow boot for one that never completes.
                    REDROID_DEFAULT_IMAGE: redroid/redroid:15.0.0_64only-latest
                    CONTAINER_NAME: ${{ steps.meta.outputs.container_name }}
                run: |
                    set -euo pipefail
                    case "$CONTAINER_NAME" in
                      ''|.|..)
                        echo "::error::Invalid container name."
                        exit 1
                        ;;
                      *[!A-Za-z0-9_.-]*)
                        echo "::error::Invalid container name '$CONTAINER_NAME': only [A-Za-z0-9_.-] characters are allowed."
                        exit 1
                        ;;
                    esac
                    data_root=$(realpath -m "$RUNNER_TEMP/redroid-data")
                    data=$(realpath -m "$data_root/$CONTAINER_NAME")
                    case "$data" in
                      "$data_root"/*) ;;
                      *)
                        echo "::error::Resolved data directory '$data' escapes '$data_root'; refusing to operate on it."
                        exit 1
                        ;;
                    esac
                    mkdir -p "$data"
                    manifest="$HOME/.rnw-ci/android-emulator.json"
                    if [ -f "$manifest" ]; then
                      # Read the manifest path from the environment rather
                      # than interpolating it into the generated source, so
                      # its contents can never be interpreted as Python.
                      image=$(MANIFEST_PATH="$manifest" python3 -c "import os, json; print(json.load(open(os.environ['MANIFEST_PATH']))['image'])")
                      prewarm_data=$(MANIFEST_PATH="$manifest" python3 -c "import os, json; print(json.load(open(os.environ['MANIFEST_PATH']))['dataDir'])")
                      # Every concurrent cell — within this run, and across any
                      # concurrent run sharing this host — would otherwise
                      # bind-mount the one manifest-provided dataDir straight
                      # into its own container. Copy it into this cell's own
                      # directory instead so concurrent writers never mutate a
                      # shared, live Android userdata filesystem.
                      sudo cp -a "$prewarm_data/." "$data/"
                      echo "REDROID_PREWARM_OK image=$image dataDir=$prewarm_data (copied into isolated $data)"
                    else
                      image="$REDROID_DEFAULT_IMAGE"
                      echo "::warning::No Redroid prewarm manifest at $manifest; pulling $image in-workflow and cold-booting a fresh /data volume for this shard instead (slower than a prewarmed host)."
                      timeout 900 sudo docker pull "$image"
                    fi
                    sudo modprobe binder_linux devices=binder,hwbinder,vndbinder 2>&1 || true
                    if [ ! -e /dev/binder ] && [ ! -e /dev/vndbinder ] && [ ! -e /dev/hwbinder ]; then
                      echo '::error::binder_linux produced none of /dev/binder, /dev/vndbinder, /dev/hwbinder on this host after modprobe. Redroid cannot run without the binder_linux kernel module; this is host-kernel provisioning a workflow run cannot self-heal safely. See issue #447 for the exact host-provisioning commands.'
                      exit 1
                    fi
                    # A "probe with ss, then docker run" port pick is a TOCTOU
                    # race: nothing stops a concurrent cell from binding the
                    # same observed-free port between the check and the bind.
                    # Sidestep the race entirely instead — bind to loopback
                    # with an empty host port (127.0.0.1::5555) and let the
                    # kernel, via Docker, atomically assign whichever
                    # ephemeral port is actually free, then read back what it
                    # picked. This also keeps Redroid's adb port off every
                    # non-loopback interface, unreachable from anywhere but
                    # this host.
                    sudo docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
                    sudo docker run -d --name "$CONTAINER_NAME" --privileged \
                      --memory 3g --memory-swap 3g --cpus 2 \
                      -v "$data":/data -p 127.0.0.1::5555 \
                      "$image" androidboot.redroid_gpu_mode=guest
                    port=$(sudo docker port "$CONTAINER_NAME" 5555/tcp | head -n1 | sed -E 's/.*:([0-9]+)$/\1/')
                    case "$port" in
                      ''|*[!0-9]*)
                        echo "::error::Could not determine the host port Docker assigned to container port 5555 on '$CONTAINER_NAME'."
                        exit 1
                        ;;
                    esac
                    # Tolerate failure here: Redroid has not necessarily opened
                    # 5555 yet immediately after `docker run -d` returns, and
                    # under set -e a hard connect failure at this point would
                    # abort the whole step before the boot-completed loop below
                    # (which retries adb connect every 5s) ever runs.
                    adb connect "localhost:$port" || true
                    deadline=$(( $(date +%s) + 600 ))
                    until [ "$(adb -s "localhost:$port" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
                      test "$(date +%s)" -lt "$deadline"
                      sleep 5
                      adb connect "localhost:$port" >/dev/null 2>&1 || true
                    done
                    # A prewarmed /data volume already carries these settings baked in,
                    # but the cold-start fallback above boots a bare volume with default
                    # (non-zero) animation scales. Un-set them unconditionally so a flow's
                    # assertion can never race a transition/window animation under
                    # Redroid's software-rendered guest GPU mode, prewarmed or not.
                    for setting in window_animation_scale transition_animation_scale animator_duration_scale; do
                      adb -s "localhost:$port" shell settings put global "$setting" 0
                    done
                    echo "ANDROID_SERIAL=localhost:$port" >> "$GITHUB_ENV"
                    echo "data_dir=$data" >> "$GITHUB_OUTPUT"

            -   uses: actions/download-artifact@v4
                with:
                    name: android-e2e-app-${{ matrix.target }}
                    path: .ci-artifacts/android-e2e-app-${{ matrix.target }}

            -   name: Install APK
                env:
                    TARGET: ${{ matrix.target }}
                run: adb -s "$ANDROID_SERIAL" install -r ".ci-artifacts/android-e2e-app-$TARGET/app-release.apk"

            -   name: Install Maestro
                run: |
                    maestro_bin="$HOME/.maestro/bin/maestro"
                    if [ ! -x "$maestro_bin" ] || [ "$("$maestro_bin" --version 2>/dev/null | tail -n 1 | tr -d '\r' || true)" != "$MAESTRO_VERSION" ]; then
                      curl -fsSL https://get.maestro.mobile.dev | env MAESTRO_VERSION="$MAESTRO_VERSION" bash
                    fi
                    echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

            -   name: Run Maestro shard
                shell: bash
                env:
                    JAVA_TOOL_OPTIONS: -Djava.awt.headless=true -Xmx2048m
                    MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
                    SHARD_INDEX: ${{ matrix.shard-index }}
                    APP_ID: ${{ steps.meta.outputs.app_id }}
                run: |
                    set -euo pipefail
                    flows=()
                    while IFS= read -r flow; do
                      flows+=("$flow")
                    done < <(find "$EXAMPLE_DIR/e2e/flows" -type f \( -name '*.yaml' -o -name '*.yml' \) | sort)
                    test "${#flows[@]}" -gt 0
                    selected=()
                    for index in "${!flows[@]}"; do
                      if (( index % MAESTRO_SHARD_COUNT == SHARD_INDEX )); then
                        selected+=("${flows[$index]}")
                      fi
                    done
                    if [ "${#selected[@]}" -eq 0 ]; then
                      echo "Shard $SHARD_INDEX has no flows; nothing to run."
                      exit 0
                    fi
                    printf 'Shard %s flows:\n%s\n' "$SHARD_INDEX" "${selected[*]}"
                    maestro test -e "APP_ID=$APP_ID" "${selected[@]}"

            # Guarded on ANDROID_SERIAL being set: when "Start prewarmed
            # Redroid container" fails before exporting it (e.g. the binder
            # guard above), an unguarded `adb -s ""` here previously hung the
            # shard for tens of minutes instead of failing fast, burning the
            # runner pool's capacity and starving the other queued shards of
            # a timely run. The per-command timeout is defense in depth
            # against any other stall in a device that connected but wedged.
            -   name: Capture final device state
                if: always() && env.ANDROID_SERIAL != ''
                shell: bash
                run: |
                    out="$MAESTRO_DEBUG_OUTPUT_DIRECTORY"
                    mkdir -p "$out"
                    timeout 30 adb -s "$ANDROID_SERIAL" exec-out screencap -p > "$out/final-screen.png" || true
                    timeout 30 adb -s "$ANDROID_SERIAL" logcat -d > "$out/logcat-full.txt" 2>&1 || true
                    timeout 30 adb -s "$ANDROID_SERIAL" logcat -d -b crash > "$out/logcat-crash.txt" 2>&1 || true
                    timeout 30 adb -s "$ANDROID_SERIAL" logcat -d ReactNative:V ReactNativeJS:V AndroidRuntime:E NativeModule:V '*:E' \
                      > "$out/logcat-app.txt" 2>&1 || true
                    timeout 30 adb -s "$ANDROID_SERIAL" shell dumpsys activity top > "$out/activity-top.txt" 2>&1 || true

            # container-name now folds in run_id/run_attempt, so a leftover
            # data dir from this cell is never reused by a later run (unlike
            # the pre-run-scoped names, nothing else will ever land on this
            # exact path) — clean it up here rather than leaking it forever
            # on this fleet's persistent self-hosted runners.
            -   name: Teardown Redroid container
                if: always()
                shell: bash
                env:
                    CONTAINER_NAME: ${{ steps.meta.outputs.container_name }}
                    DATA_DIR: ${{ steps.redroid.outputs.data_dir }}
                run: |
                    sudo docker rm -f "$CONTAINER_NAME" || true
                    if [ -n "$DATA_DIR" ]; then
                      sudo rm -rf "$DATA_DIR" || true
                    fi

            -   name: Upload Maestro artifacts
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: maestro-android-${{ matrix.target }}-shard-${{ matrix.shard-index }}
                    path: ${{ env.MAESTRO_DEBUG_OUTPUT_DIRECTORY }}/**
                    if-no-files-found: warn
                    retention-days: 7

    status:
        name: Android Maestro E2E result
        needs: [detect, build, test]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Report
              env:
                  DETECT_RESULT: ${{ needs.detect.result }}
                  PAYMENTS_AFFECTED: ${{ needs.detect.outputs.payments_affected }}
                  BUILD_RESULT: ${{ needs.build.result }}
                  TEST_RESULT: ${{ needs.test.result }}
              run: |
                  if [ "$DETECT_RESULT" != "success" ]; then
                    echo "Detection job did not succeed."
                    exit 1
                  fi
                  if [ "$PAYMENTS_AFFECTED" != "true" ]; then
                    echo "Skipped: payments dependency tree untouched."
                    exit 0
                  fi
                  if [ "$BUILD_RESULT" != "success" ]; then
                    echo "Build job failed."
                    exit 1
                  fi
                  if [ "$TEST_RESULT" != "success" ]; then
                    echo "Maestro suite failed."
                    exit 1
                  fi
                  echo "Maestro suite passed."
