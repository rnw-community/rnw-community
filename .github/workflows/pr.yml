            -   name: Upload coverage - react-native-payments
                if: hashFiles('packages/react-native-payments/coverage/lcov.info') != ''
                uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
