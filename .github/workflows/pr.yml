    package-manager-smoke:
        name: Package manager smoke (${{ matrix.package-manager }})
        timeout-minutes: 10
        runs-on: ubuntu-latest
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                package-manager: [npm, yarn, pnpm, bun]

        steps:
            -   name: Checkout repository
                uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
                with:
                    persist-credentials: false

            -   name: Setup Node
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 22.x
                    cache: yarn

            -   name: Enable corepack
                run: corepack enable

            -   name: Install dependencies
                run: yarn install --immutable

            -   name: Build smoke packages
                run: yarn turbo run build --filter=@rnw-community/shared --filter=@rnw-community/react-native-collapsible-header --filter=@rnw-community/react-native-screen-chrome --filter=@rnw-community/react-native-payments

            -   name: Pack tarballs
                run: |
                    mkdir -p "$RUNNER_TEMP/tarballs"
                    npm pack --silent --pack-destination "$RUNNER_TEMP/tarballs" ./packages/shared ./packages/react-native-collapsible-header ./packages/react-native-screen-chrome ./packages/react-native-payments

            -   name: Scaffold smoke project
                run: |
                    mkdir -p "$RUNNER_TEMP/smoke"
                    cat > "$RUNNER_TEMP/smoke/package.json" <<JSON
                    {
                      "name": "smoke-${{ matrix.package-manager }}",
                      "private": true,
                      "version": "1.0.0",
                      "dependencies": {
                        "@rnw-community/react-native-collapsible-header": "file:$(ls "$RUNNER_TEMP"/tarballs/rnw-community-react-native-collapsible-header-*.tgz)",
                        "@rnw-community/react-native-screen-chrome": "file:$(ls "$RUNNER_TEMP"/tarballs/rnw-community-react-native-screen-chrome-*.tgz)",
                        "@rnw-community/react-native-payments": "file:$(ls "$RUNNER_TEMP"/tarballs/rnw-community-react-native-payments-*.tgz)",
                        "@rnw-community/shared": "file:$(ls "$RUNNER_TEMP"/tarballs/rnw-community-shared-*.tgz)",
                        "@react-native-masked-view/masked-view": "^0.3.2",
                        "expo-blur": "~56.0.3",
                        "expo-linear-gradient": "~56.0.4",
                        "react": "^19.2.3",
                        "react-native": "0.85.3",
                        "react-native-reanimated": "4.3.1",
                        "react-native-safe-area-context": "~5.7.0",
                        "react-native-worklets": "0.8.3"
                      },
                      "devDependencies": {
                        "@babel/core": "^7.29.7",
                        "@react-native/metro-config": "0.85.3",
                        "@types/react": "^19.2.0",
                        "typescript": "^5.9.3"
                      },
                      "resolutions": {
                        "@rnw-community/react-native-collapsible-header": "file:$(ls "$RUNNER_TEMP"/tarballs/rnw-community-react-native-collapsible-header-*.tgz)"
                      },
                      "pnpm": {
                        "overrides": {
                          "@rnw-community/react-native-collapsible-header": "file:$(ls "$RUNNER_TEMP"/tarballs/rnw-community-react-native-collapsible-header-*.tgz)"
                        }
                      }
                    }
                    JSON
                    cat > "$RUNNER_TEMP/smoke/smoke.ts" <<'TS'
                    import type { PaymentDetailsInit } from '@rnw-community/react-native-payments';
                    import { PaymentRequest } from '@rnw-community/react-native-payments';
                    import type { CollapsibleHeaderProps } from '@rnw-community/react-native-collapsible-header';
                    import { CollapsibleHeader } from '@rnw-community/react-native-collapsible-header';
                    import type { ScreenChromeConfigInterface } from '@rnw-community/react-native-screen-chrome';
                    import { ScreenChromeProvider } from '@rnw-community/react-native-screen-chrome';

                    const details: PaymentDetailsInit | undefined = undefined;
                    const collapsibleHeaderProps: CollapsibleHeaderProps | undefined = undefined;
                    const screenChromeConfig: ScreenChromeConfigInterface | undefined = undefined;

                    void PaymentRequest;
                    void details;
                    void CollapsibleHeader;
                    void collapsibleHeaderProps;
                    void ScreenChromeProvider;
                    void screenChromeConfig;
                    TS

            -   name: Set up pnpm
                if: matrix.package-manager == 'pnpm'
                uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
                with:
                    version: 9

            -   name: Set up bun
                if: matrix.package-manager == 'bun'
                uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

            -   name: Install tarball with npm
                if: matrix.package-manager == 'npm'
                working-directory: ${{ runner.temp }}/smoke
                run: npm install --no-audit --no-fund

            -   name: Install tarball with yarn
                if: matrix.package-manager == 'yarn'
                working-directory: ${{ runner.temp }}/smoke
                run: yarn install --no-lockfile

            -   name: Install tarball with pnpm
                if: matrix.package-manager == 'pnpm'
                working-directory: ${{ runner.temp }}/smoke
                run: pnpm install --no-frozen-lockfile

            -   name: Install tarball with bun
                if: matrix.package-manager == 'bun'
                working-directory: ${{ runner.temp }}/smoke
                run: bun install

            -   name: Resolve require (CJS) condition
                working-directory: ${{ runner.temp }}/smoke
                run: node -e "require.resolve('@rnw-community/react-native-collapsible-header'); require.resolve('@rnw-community/react-native-screen-chrome'); require.resolve('@rnw-community/react-native-payments')"

            -   name: Resolve import (ESM) condition
                working-directory: ${{ runner.temp }}/smoke
                run: node --input-type=module -e "import.meta.resolve('@rnw-community/react-native-collapsible-header'); import.meta.resolve('@rnw-community/react-native-screen-chrome'); import.meta.resolve('@rnw-community/react-native-payments')"

            -   name: Typecheck against shipped types
                working-directory: ${{ runner.temp }}/smoke
                run: ./node_modules/.bin/tsc --noEmit --strict --skipLibCheck --target es2021 --lib es2021,dom --module esnext --moduleResolution bundler --jsx react smoke.ts

            -   name: Comprehensive ESM/CJS require()/import() smoke (every publishable package, npm leg only)
                if: matrix.package-manager == 'npm'
                run: yarn smoke:esm

    required-checks:
        name: Required checks
        if: always()
        needs: [code-quality, package-manager-smoke]
        timeout-minutes: 5
        runs-on: ubuntu-latest
        permissions: {}

        steps:
            -   name: Verify required jobs succeeded
                env:
                    CODE_QUALITY_RESULT: ${{ needs.code-quality.result }}
                    PACKAGE_MANAGER_SMOKE_RESULT: ${{ needs.package-manager-smoke.result }}
                run: |
                    echo "code-quality=${CODE_QUALITY_RESULT}"
                    echo "package-manager-smoke=${PACKAGE_MANAGER_SMOKE_RESULT}"
                    if [ "${CODE_QUALITY_RESULT}" != 'success' ] || [ "${PACKAGE_MANAGER_SMOKE_RESULT}" != 'success' ]; then
                      echo "Required jobs did not pass"
                      exit 1
                    fi
