name: Pull Request

env:
    TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    PR_NUMBER: ${{ github.event.pull_request.number }}
    PR_TITLE: ${{ github.event.pull_request.title }}
    YARN_ENABLE_IMMUTABLE_INSTALLS: true

concurrency:
    group: pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]

jobs:
    code-quality:
        name: Build, lint and test (Node ${{ matrix.node-version }})
        timeout-minutes: 15
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: [22.x, 24.x]
        permissions:
            contents: read
            id-token: write
            issues: write
            pull-requests: write

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v5
                with:
                    fetch-depth: 0

            -   name: Close Stale Issues
                if: matrix.node-version == '22.x'
                uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0

            -   name: Setup Node
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: ${{ matrix.node-version }}
                    cache: yarn

            -   name: Enable corepack
                run: corepack enable

            -   name: Install dependencies
                run: yarn install --immutable

            -   name: Lint the PR Title
                run: echo "${{ env.PR_TITLE }}" | node_modules/.bin/commitlint

            -   name: Build packages
                run: yarn turbo run build --affected

            -   name: Typescript checks
                run: yarn turbo run ts --affected

            -   name: Typescript checks (spec files, nodenext resolution)
                run: yarn turbo run ts:nodenext --affected

            -   name: ESLint checks
                run: yarn turbo run lint --affected

            -   name: Publish hygiene checks (publint, attw)
                run: yarn publint

            -   name: Find dead code
                run: yarn deadcode

            -   name: Find copy-paste
                run: yarn cpd

            -   name: Unit tests
                run: yarn turbo run test:coverage --affected

            -   name: Upload coverage - decorators-core
                if: hashFiles('packages/decorators-core/coverage/lcov.info') != ''
                uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
                with:
                    use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
                    fail_ci_if_error: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
                    disable_search: true
                    files: packages/decorators-core/coverage/lcov.info
                    flags: decorators-core

            -   name: Upload coverage - eslint-plugin
                if: hashFiles('packages/eslint-plugin/coverage/lcov.info') != ''
                uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
                with:
                    use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
                    fail_ci_if_error: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
                    disable_search: true
                    files: packages/eslint-plugin/coverage/lcov.info
