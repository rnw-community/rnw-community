name: Pull Request

env:
    TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    PR_NUMBER: ${{ github.event.pull_request.number }}
    PR_TITLE: ${{ github.event.pull_request.title }}

concurrency:
    group: pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
    stale:
        name: Close stale issues and pull requests
        timeout-minutes: 10
        runs-on: [self-hosted, trf-linux-amd64-2x4]
        permissions:
            issues: write # labels and closes stale issues
            pull-requests: write # labels and closes stale pull requests

        steps:
            -   name: Close Stale Issues
                uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
                with:
                    exempt-issue-labels: epic,enhancement,bug,dependencies,react-native-payments
                    exempt-pr-labels: dependencies
                    close-issue-message: >-
                        Closed automatically after 67 days without activity. Comment or reopen if this is still
                        relevant; issues labelled epic, enhancement, bug, dependencies or react-native-payments are
                        never closed automatically.

    code-quality:
        name: Build, lint and test (Node ${{ matrix.node-version }})
        timeout-minutes: 15
        # Turbo build, type-aware lint and coverage over the whole monorepo
        # need more than the 4 GiB 2x4 shape.
        runs-on: [self-hosted, trf-linux-amd64-4x8]
        strategy:
            fail-fast: false
            matrix:
                node-version: [22.x, 24.x]
        permissions:
            contents: read
            id-token: write # Codecov OIDC upload authentication

        steps:
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
                    persist-credentials: false

            -   name: Setup pnpm
                uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

            -   name: Setup Node
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: ${{ matrix.node-version }}
                    cache: pnpm

            -   name: Install dependencies
                run: pnpm install --frozen-lockfile

            -   name: Lint the PR Title
                run: echo "${PR_TITLE}" | node_modules/.bin/commitlint

            -   name: Root docs link check (llms.txt, README, AGENTS, CONTRIBUTING, RELEASE, SECURITY)
                run: pnpm assert:docs

            -   name: Build packages
                run: pnpm exec turbo run build --affected

            -   name: Typescript checks
                run: pnpm exec turbo run ts --affected

            -   name: Typescript checks (spec files, nodenext resolution)
                run: pnpm exec turbo run ts:nodenext --affected

            -   name: Oxlint config in sync with ESLint config
                run: pnpm lint:oxlint:check

            -   name: Oxlint checks (syntax)
                run: pnpm lint:fast

            -   name: Native tooling regression checks
                run: pnpm test:tooling

            -   name: Oxlint type-aware and ESLint checks
                run: pnpm exec turbo run lint --affected

            -   name: Publish hygiene checks (publint, attw)
                run: pnpm publint

            -   name: Pack-content gate (llms.txt, no test/build artifacts, entry targets)
                run: pnpm assert:pack

            -   name: TSDoc @see links resolve to real files and readme headings
                run: pnpm assert:see-anchors

            -   name: Find dead code
                run: pnpm deadcode

            -   name: Find copy-paste
                run: pnpm cpd

            -   name: Unit tests
                run: pnpm exec turbo run test:coverage --affected --concurrency=2 -- --runInBand

            -   name: Upload coverage - decorators-core
                if: hashFiles('packages/decorators-core/coverage/lcov.info') != ''
                uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
                with:
                    use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
                    fail_ci_if_error: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
                    disable_search: true
                    files: packages/decorators-core/coverage/lcov.info
                    flags: decorators-core

            -   name: Upload coverage - eslint-plugin
                if: hashFiles('packages/eslint-plugin/coverage/lcov.info') != ''
                uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
                with:
                    use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
                    fail_ci_if_error: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
