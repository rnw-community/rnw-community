    package-manager-smoke:
        name: Package manager smoke (${{ matrix.package-manager }})
        timeout-minutes: 10
        runs-on: [self-hosted, trf-linux-amd64-2x4]
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                package-manager: [npm, yarn, pnpm, bun]

        steps:
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Setup pnpm
                uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

            -   name: Setup Node
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 22.x
                    cache: pnpm

            -   name: Install dependencies
                run: pnpm install --frozen-lockfile

            -   name: Build smoke packages
                run: pnpm exec turbo run build --filter=@rnw-community/shared --filter=@rnw-community/react-native-collapsible-header --filter=@rnw-community/react-native-screen-chrome --filter=@rnw-community/react-native-payments

            -   name: Pack tarballs
                run: |
                    mkdir -p "$RUNNER_TEMP/tarballs"
                    npm pack --silent --pack-destination "$RUNNER_TEMP/tarballs" ./packages/shared ./packages/react-native-collapsible-header ./packages/react-native-screen-chrome ./packages/react-native-payments

            -   name: Scaffold smoke project
                env:
                    PACKAGE_MANAGER: ${{ matrix.package-manager }}
                run: |
                    mkdir -p "$RUNNER_TEMP/smoke"
                    cat > "$RUNNER_TEMP/smoke/package.json" <<JSON
                    {
                      "name": "smoke-${PACKAGE_MANAGER}",
                      "private": true,
                      "version": "1.0.0",
                      "dependencies": {
                        "@rnw-community/react-native-collapsible-header": "file:$(ls "$RUNNER_TEMP"/tarballs/rnw-community-react-native-collapsible-header-*.tgz)",
                        "@rnw-community/react-native-screen-chrome": "file:$(ls "$RUNNER_TEMP"/tarballs/rnw-community-react-native-screen-chrome-*.tgz)",
                        "@rnw-community/react-native-payments": "file:$(ls "$RUNNER_TEMP"/tarballs/rnw-community-react-native-payments-*.tgz)",
                        "@rnw-community/shared": "file:$(ls "$RUNNER_TEMP"/tarballs/rnw-community-shared-*.tgz)",
                        "@react-native-masked-view/masked-view": "^0.3.2",
                        "expo-blur": "~56.0.3",
                        "expo-linear-gradient": "~56.0.4",
                        "react": "^19.2.3",
                        "react-native": "0.85.3",
                        "react-native-reanimated": "4.3.1",
                        "react-native-safe-area-context": "~5.7.0",
                        "react-native-worklets": "0.8.3"
                      },
                      "devDependencies": {
                        "@babel/core": "^7.29.7",
                        "@react-native/metro-config": "0.85.3",
                        "@types/react": "^19.2.0",
                        "typescript": "^5.9.3"
                      }
                    }
                    JSON
                    node --input-type=module - "$RUNNER_TEMP/smoke/package.json" <<'JS'
                    import fs from 'node:fs';
                    const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                    const target = process.argv[2];
                    const consumer = JSON.parse(fs.readFileSync(target, 'utf8'));
                    for (const compiler of ['tsrs', '@typescript/native']) {
                      consumer.devDependencies[compiler] = root.devDependencies[compiler];
                    }
                    fs.writeFileSync(target, JSON.stringify(consumer, null, 2) + '\n');
                    JS
                    cat > "$RUNNER_TEMP/smoke/smoke.ts" <<'TS'
                    import type { PaymentDetailsInit } from '@rnw-community/react-native-payments';
                    import { PaymentRequest } from '@rnw-community/react-native-payments';
                    import type { CollapsibleHeaderProps } from '@rnw-community/react-native-collapsible-header';
                    import { CollapsibleHeader } from '@rnw-community/react-native-collapsible-header';
                    import type { ScreenChromeConfigInterface } from '@rnw-community/react-native-screen-chrome';
                    import { ScreenChromeProvider } from '@rnw-community/react-native-screen-chrome';

                    const details: PaymentDetailsInit | undefined = undefined;
                    const collapsibleHeaderProps: CollapsibleHeaderProps | undefined = undefined;
                    const screenChromeConfig: ScreenChromeConfigInterface | undefined = undefined;

                    void PaymentRequest;
                    void details;
                    void CollapsibleHeader;
                    void collapsibleHeaderProps;
                    void ScreenChromeProvider;
                    void screenChromeConfig;
                    TS

            -   name: Set up pnpm
                if: matrix.package-manager == 'pnpm'
                uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

            -   name: Set up bun
                if: matrix.package-manager == 'bun'
                uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

            -   name: Install tarball with npm
                if: matrix.package-manager == 'npm'
                working-directory: ${{ runner.temp }}/smoke
                run: npm install --no-audit --no-fund

            -   name: Install tarball with yarn
                if: matrix.package-manager == 'yarn'
                working-directory: ${{ runner.temp }}/smoke
                env:
                    COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
                # The fleet image's yarn is the corepack shim (Yarn 4); this leg tests Yarn classic.
                run: corepack yarn@1.22.22 install --no-lockfile

            -   name: Install tarball with pnpm
                if: matrix.package-manager == 'pnpm'
                working-directory: ${{ runner.temp }}/smoke
                run: pnpm install --no-frozen-lockfile

            -   name: Install tarball with bun
                if: matrix.package-manager == 'bun'
                working-directory: ${{ runner.temp }}/smoke
                run: bun install

            -   name: Resolve require (CJS) condition
                working-directory: ${{ runner.temp }}/smoke
                run: node -e "require.resolve('@rnw-community/react-native-collapsible-header'); require.resolve('@rnw-community/react-native-screen-chrome'); require.resolve('@rnw-community/react-native-payments')"

            -   name: Resolve import (ESM) condition
                working-directory: ${{ runner.temp }}/smoke
                run: node --input-type=module -e "import.meta.resolve('@rnw-community/react-native-collapsible-header'); import.meta.resolve('@rnw-community/react-native-screen-chrome'); import.meta.resolve('@rnw-community/react-native-payments')"

            -   name: Typecheck shipped types with TypeScript 5.9
                working-directory: ${{ runner.temp }}/smoke
                run: node ./node_modules/typescript/bin/tsc --noEmit --strict --skipLibCheck --target es2021 --lib es2021,dom --module esnext --moduleResolution bundler --jsx react smoke.ts

            -   name: Typecheck shipped types with TypeScript 7
                working-directory: ${{ runner.temp }}/smoke
                run: node ./node_modules/@typescript/native/bin/tsc --noEmit --strict --skipLibCheck --target es2021 --lib es2021,dom --module esnext --moduleResolution bundler --jsx react smoke.ts

            -   name: Typecheck shipped types with tsrs
                working-directory: ${{ runner.temp }}/smoke
                run: ./node_modules/.bin/tsrs --noEmit --strict --skipLibCheck --target es2021 --lib es2021,dom --module esnext --moduleResolution bundler --jsx react smoke.ts

            -   name: Comprehensive ESM/CJS require()/import() smoke (every publishable package, npm leg only)
                if: matrix.package-manager == 'npm'
                run: pnpm smoke:esm

    workflow-lint:
        name: Workflow lint (actionlint, zizmor)
        timeout-minutes: 10
        runs-on: [self-hosted, trf-linux-amd64-2x4]
        permissions:
            contents: read
        env:
            ACTIONLINT_VERSION: '1.7.12'
            ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
            ZIZMOR_VERSION: '1.31.0'

        steps:
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Install shellcheck and pipx
                run: |
                    set -euo pipefail
                    sudo apt-get update -qq
                    sudo apt-get -o DPkg::Lock::Timeout=300 install -y -qq --no-install-recommends shellcheck pipx

            -   name: Install actionlint
                run: |
                    set -euo pipefail
                    archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                    curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
                    echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
                    mkdir -p "$RUNNER_TEMP/actionlint"
                    tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/actionlint" actionlint
                    echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

            -   name: actionlint (with shellcheck)
                run: |
                    shellcheck --version
                    actionlint -color

            -   name: zizmor
                env:
                    GH_TOKEN: ${{ github.token }}
                run: pipx run "zizmor==${ZIZMOR_VERSION}" --format=github .github/workflows

    nestjs-compatibility:
        name: NestJS compatibility (@nestjs/common ${{ matrix.nestjs }}, @nestjs/config ${{ matrix.nestjs-config }})
        timeout-minutes: 20
        runs-on: [self-hosted, trf-linux-amd64-2x4]
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   nestjs: 11.1.28
                        nestjs-config: 4.0.4
                    -   nestjs: 12.0.0
                        nestjs-config: 12.0.1

        steps:
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Setup pnpm
                uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

            -   name: Setup Node
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 22.x
                    cache: pnpm

            -   name: Pin the NestJS stack under test
                env:
                    NESTJS_VERSION: ${{ matrix.nestjs }}
                    NESTJS_CONFIG_VERSION: ${{ matrix.nestjs-config }}
                run: |
                    sed -i "s|^overrides:$|overrides:\n  \"@nestjs/common\": ${NESTJS_VERSION}\n  \"@nestjs/core\": ${NESTJS_VERSION}\n  \"@nestjs/config\": ${NESTJS_CONFIG_VERSION}|" pnpm-workspace.yaml
                    pnpm install --no-frozen-lockfile
                    pnpm why -r @nestjs/common @nestjs/core @nestjs/config | grep '^@nestjs/'

            -   name: Build the NestJS packages and their workspace dependencies
                run: pnpm exec turbo run build --filter='@rnw-community/nestjs-*'

            -   name: Typecheck and test the NestJS packages
                run: pnpm exec turbo run ts test:coverage --filter='@rnw-community/nestjs-*'

    reanimated-compatibility:
        name: Reanimated compatibility (react-native-reanimated ${{ matrix.reanimated }}, react-native-worklets ${{ matrix.worklets }}, ${{ matrix.tasks }})
        timeout-minutes: 20
        runs-on: [self-hosted, trf-linux-amd64-2x4]
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   reanimated: 4.1.7
                        worklets: 0.8.3
                        tasks: ts
                    -   reanimated: 4.2.3
                        worklets: 0.8.3
                        tasks: ts test:coverage

        steps:
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Setup pnpm
                uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

            -   name: Setup Node
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 22.x
                    cache: pnpm

            -   name: Pin the Reanimated stack under test
                env:
                    REANIMATED_VERSION: ${{ matrix.reanimated }}
                    WORKLETS_VERSION: ${{ matrix.worklets }}
                run: |
                    set -euo pipefail
                    sed -i "s|^overrides:$|overrides:\n  react-native-reanimated: ${REANIMATED_VERSION}\n  react-native-worklets: ${WORKLETS_VERSION}|" pnpm-workspace.yaml
                    pnpm install --no-frozen-lockfile
                    resolved="$(pnpm why -r react-native-reanimated react-native-worklets | grep '^react-native-' | sort -u)"
                    expected="$(printf 'react-native-reanimated@%s\nreact-native-worklets@%s' "${REANIMATED_VERSION}" "${WORKLETS_VERSION}")"
                    echo "${resolved}"
                    if [ "${resolved}" != "${expected}" ]; then
                      echo "::error::Resolved Reanimated stack does not match the pinned versions"
                      exit 1
                    fi

            -   name: Build the Reanimated packages and their workspace dependencies
                run: pnpm exec turbo run build --filter=@rnw-community/react-native-collapsible-header --filter=@rnw-community/react-native-screen-chrome

            -   name: Typecheck and test the Reanimated packages
                env:
                    TURBO_TASKS: ${{ matrix.tasks }}
                run: |
                    read -ra tasks <<< "${TURBO_TASKS}"
                    pnpm exec turbo run "${tasks[@]}" --force --filter=@rnw-community/react-native-collapsible-header --filter=@rnw-community/react-native-screen-chrome

    screen-chrome-web-e2e:
        name: Screen chrome web edge fade (Playwright, Chromium)
        timeout-minutes: 15
        runs-on: [self-hosted, trf-linux-amd64-2x4]
        permissions:
            contents: read

        steps:
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Setup pnpm
                uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

            -   name: Setup Node
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 24.x
                    cache: pnpm

            -   name: Install dependencies
                run: pnpm install --frozen-lockfile

            -   name: Build the screen chrome workspace dependencies
                run: pnpm exec turbo run build --filter=@rnw-community/react-native-screen-chrome^...

            -   name: Install Chromium
                run: pnpm --filter @rnw-community/react-native-screen-chrome exec playwright install --with-deps chromium

            -   name: Edge-fade harness metrics catch every known blur regression
                run: pnpm --filter @rnw-community/react-native-screen-chrome-example e2e:harness:check

            -   name: Edge fade computed CSS, rendered blur and measured harness matrix
                run: pnpm --filter @rnw-community/react-native-screen-chrome test:web

            -   name: Upload web harness captures
                if: always()
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
                with:
                    name: edge-fade-web-chromium
                    path: packages/react-native-screen-chrome/node_modules/.cache/web-e2e/edge-fade-chromium
                    if-no-files-found: error

    edge-fade-ios:
        permissions:
            contents: read
            packages: write
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/ios-maestro.yml@c45b9b0e1cc8e841a9d1f1df5f8a9acaa422ce19 # v4.3.1
        with:
            call-scope: edge-fade
            shard-count: 1
            targets: >-
                [
                  {"name":"screen-chrome-harness","appDir":"packages/react-native-screen-chrome-example/apps/expo","workspace":"reactnativescreenchromeexpoexample.xcworkspace","scheme":"reactnativescreenchromeexpoexample","appId":"com.reactnativescreenchromeexpoexample","prebuildCommand":"pnpm prebuild","flowsDir":"packages/react-native-screen-chrome-example/e2e/harness"}
                ]
            flows-name-pattern: '*.yaml'
            pre-flow-command: |
                dest="${ARTIFACTS_DIR:-$MAESTRO_DEBUG_OUTPUT_DIRECTORY}/edge-fade"
                mkdir -p "$dest/temporal"
                scratch="$RUNNER_TEMP/maestro-debug-${SHARD_INDEX}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                nohup bash -c 'while sleep 0.2; do find "$1" -path "*/takeScreenshot/edge-fade/*.png" -exec cp -f {} "$0" \; 2>/dev/null; find "$1" -path "*/startRecording/temporal-*.mp4" -exec cp -f {} "$0/temporal" \; 2>/dev/null; done' "$dest" "$scratch" >/dev/null 2>&1 &
            install-command: pnpm install --frozen-lockfile
            build-command: pnpm build --filter=...@rnw-community/react-native-screen-chrome-example-expo
            trigger-paths: |
                packages/react-native-screen-chrome/**
                packages/react-native-screen-chrome-example/**
                .github/workflows/pr.yml
            maestro-version: '2.8.0'
            build-timeout-minutes: 120
            xcode-version: '26.4.1'
            xcode-build: '17E202'
            runner-labels: '["self-hosted","macOS","ARM64","macos-maestro"]'

    edge-fade-android:
        permissions:
            contents: read
            packages: write
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/android-maestro.yml@c45b9b0e1cc8e841a9d1f1df5f8a9acaa422ce19 # v4.3.1
        with:
            call-scope: edge-fade
            shard-count: 1
            targets: >-
                [
                  {"name":"screen-chrome-harness","appDir":"packages/react-native-screen-chrome-example/apps/expo","appId":"com.reactnativescreenchromeexpoexample","prebuildCommand":"pnpm prebuild","flowsDir":"packages/react-native-screen-chrome-example/e2e/harness"}
                ]
            flows-name-pattern: '*.yaml'
            pre-flow-command: |
                dest="${ARTIFACTS_DIR:-$MAESTRO_DEBUG_OUTPUT_DIRECTORY}/edge-fade"
                mkdir -p "$dest/temporal"
                scratch="$RUNNER_TEMP/maestro-debug-${SHARD_INDEX}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                nohup bash -c 'while sleep 0.2; do find "$1" -path "*/takeScreenshot/edge-fade/*.png" -exec cp -f {} "$0" \; 2>/dev/null; find "$1" -path "*/startRecording/temporal-*.mp4" -exec cp -f {} "$0/temporal" \; 2>/dev/null; done' "$dest" "$scratch" >/dev/null 2>&1 &
            install-command: pnpm install --frozen-lockfile
            build-command: pnpm build --filter=...@rnw-community/react-native-screen-chrome-example-expo
            trigger-paths: |
                packages/react-native-screen-chrome/**
                packages/react-native-screen-chrome-example/**
                .github/workflows/pr.yml
            maestro-version: '2.8.0'
            build-timeout-minutes: 120
            emulator-profile: Galaxy Nexus
            emulator-slots-dir: /var/lib/mobile-ci/emulator-slots

    edge-fade-metrics:
        name: Edge-fade harness (${{ matrix.label }})
        needs: [edge-fade-ios, edge-fade-android]
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: ios
                      label: iOS
                    - platform: android
                      label: Android
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            actions: read
        env:
            HARNESS_RESULT: ${{ needs[format('edge-fade-{0}', matrix.platform)].outputs.result }}
        steps:
            - name: Require the harness run
              run: |
                  echo "harness=${HARNESS_RESULT:-missing}"
                  case "$HARNESS_RESULT" in passed|skipped) ;; *) exit 1 ;; esac

            - name: Checkout repository
              if: env.HARNESS_RESULT == 'passed'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              if: env.HARNESS_RESULT == 'passed'
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

            - name: Setup Node
              if: env.HARNESS_RESULT == 'passed'
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.x
                  cache: pnpm

            - name: Install the metric script dependencies
              if: env.HARNESS_RESULT == 'passed'
              run: pnpm install --frozen-lockfile --filter @rnw-community/react-native-screen-chrome-example

            - name: Download the harness captures
              if: env.HARNESS_RESULT == 'passed'
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: maestro-${{ matrix.platform }}*screen-chrome-harness-shard-*
                  path: harness
                  merge-multiple: true

            - name: Install ffmpeg
              if: env.HARNESS_RESULT == 'passed'
              run: |
                  if ! command -v ffmpeg >/dev/null 2>&1; then
                    sudo apt-get update
                    sudo apt-get install -y ffmpeg
                  fi

            - name: Extract temporal harness frames
              if: env.HARNESS_RESULT == 'passed'
              run: |
                  set -euo pipefail
                  for recording in harness/edge-fade/temporal/temporal-*.mp4; do
                    test -f "$recording" || continue
                    cell="${recording##*/temporal-}"
                    cell="${cell%.mp4}"
                    mkdir -p "harness/edge-fade/temporal/$cell"
                    ffmpeg -v error -xerror -i "$recording" -f null -
                    ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$recording" > "harness/edge-fade/temporal/$cell/duration.txt"
                    ffmpeg -v error -xerror -i "$recording" -fps_mode passthrough "harness/edge-fade/temporal/$cell/%06d.png"
                  done

            - name: Measure the edge-fade blur
              if: env.HARNESS_RESULT == 'passed'
              run: node packages/react-native-screen-chrome-example/e2e/harness/edge-fade-metrics.mjs harness/edge-fade packages/react-native-screen-chrome-example/e2e/harness/baselines/${{ matrix.platform }}

    required-checks:
        name: Required checks
        if: always()
        needs: [code-quality, package-manager-smoke, workflow-lint, nestjs-compatibility, reanimated-compatibility, screen-chrome-web-e2e, edge-fade-metrics]
        timeout-minutes: 5
        runs-on: [self-hosted, trf-linux-amd64-2x4]
        permissions: {}

        steps:
            -   name: Verify required jobs succeeded
                env:
                    CODE_QUALITY_RESULT: ${{ needs.code-quality.result }}
                    PACKAGE_MANAGER_SMOKE_RESULT: ${{ needs.package-manager-smoke.result }}
                    WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
                    NESTJS_COMPATIBILITY_RESULT: ${{ needs.nestjs-compatibility.result }}
                    REANIMATED_COMPATIBILITY_RESULT: ${{ needs.reanimated-compatibility.result }}
                    EDGE_FADE_METRICS_RESULT: ${{ needs.edge-fade-metrics.result }}
                    SCREEN_CHROME_WEB_E2E_RESULT: ${{ needs.screen-chrome-web-e2e.result }}
                run: |
                    echo "code-quality=${CODE_QUALITY_RESULT}"
                    echo "package-manager-smoke=${PACKAGE_MANAGER_SMOKE_RESULT}"
                    echo "workflow-lint=${WORKFLOW_LINT_RESULT}"
                    echo "nestjs-compatibility=${NESTJS_COMPATIBILITY_RESULT}"
                    echo "reanimated-compatibility=${REANIMATED_COMPATIBILITY_RESULT}"
                    echo "edge-fade-metrics=${EDGE_FADE_METRICS_RESULT}"
                    echo "screen-chrome-web-e2e=${SCREEN_CHROME_WEB_E2E_RESULT}"
                    if [ "${CODE_QUALITY_RESULT}" != 'success' ] || [ "${PACKAGE_MANAGER_SMOKE_RESULT}" != 'success' ] || [ "${WORKFLOW_LINT_RESULT}" != 'success' ] || [ "${NESTJS_COMPATIBILITY_RESULT}" != 'success' ] || [ "${REANIMATED_COMPATIBILITY_RESULT}" != 'success' ] || [ "${SCREEN_CHROME_WEB_E2E_RESULT}" != 'success' ] || [ "${EDGE_FADE_METRICS_RESULT}" != 'success' ]; then
                      echo "Required jobs did not pass"
                      exit 1
                    fi
