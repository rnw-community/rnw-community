name: PR Closed Cleanup

on:
    pull_request:
        types: [closed]

permissions: {}

jobs:
    cleanup:
        name: Cancel queued/in-progress runs for the closed PR branch
        permissions:
            actions: write # cancels superseded runs of the closed PR
        uses: rnw-community/mobile-ci/.github/workflows/pr-closed-cleanup-reusable.yml@f42a0f863990b5da40b35261f7d610e42215313e # v4.11.1
        with:
            control-runner-labels: '["self-hosted","linux-portable-2x4"]'
            ota-preview-cleanup-runner-labels: '["self-hosted","linux-portable-2x4"]'
