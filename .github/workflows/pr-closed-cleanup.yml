name: PR Closed Cleanup

on:
    pull_request:
        types: [closed]

permissions: {}

jobs:
    cleanup:
        name: Cancel queued/in-progress runs for the closed PR branch
        permissions:
            actions: write # cancels superseded runs of the closed PR
        uses: rnw-community/mobile-ci/.github/workflows/pr-closed-cleanup-reusable.yml@443067982b184fe16ceef20a8ff2e36d5af286b6 # v4.6.0
        with:
            control-runner-labels: '["self-hosted","trf-linux-amd64-2x4"]'
            ota-preview-cleanup-runner-labels: '["self-hosted","trf-linux-amd64-2x4"]'
