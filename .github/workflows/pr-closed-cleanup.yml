name: PR Closed Cleanup

on:
    pull_request:
        types: [closed]

permissions: {}

jobs:
    cleanup:
        name: Cancel queued/in-progress runs for the closed PR branch
        permissions:
            actions: write # cancels superseded runs of the closed PR
        uses: rnw-community/mobile-ci/.github/workflows/pr-closed-cleanup-reusable.yml@240cad0f6ba43da17e42f9aefc8637567941cb58 # v4.3.0
