name: Release and publish to NPM
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          conventional = version + publish changed packages (the push default).
          from-package = publish any package whose version is already tagged but missing from the registry,
          for recovering a run that versioned successfully and then failed to publish.
        type: choice
        options:
          - conventional
          - from-package
        default: conventional

permissions:
  id-token: write
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  release:
    name: Publish a release
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # A manual from-package recovery must never overlap a push-triggered release: two concurrent
    # lerna runs would race on tags and publishes. Never cancel a run that may be mid-publish.
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      # Required for npm provenance attestations.
      id-token: write
      # Required to read the repository during checkout.
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Setup Git user
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          git config user.name "Vitalii Yehorov"
          git config user.email "vitalyiegorov@gmail.com"
          git remote rm origin
          git remote add origin https://vitalyiegorov:${GITHUB_TOKEN}@github.com/rnw-community/rnw-community.git
          git fetch
          git branch --set-upstream-to=origin/master master

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Unit tests
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Publish a release
        id: publish
        if: github.event_name == 'push' || inputs.mode == 'conventional'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: pnpm release

      - name: Publish packages missing from the registry
        id: publish-from-package
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'from-package'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: pnpm release:from-package

      # Runs whenever a publish was attempted, including when it failed: a failed or partial publish is
      # exactly the case this assertion exists to report. Stays skipped when an earlier build or test
      # step failed, because both publish steps are skipped then too.
      - name: Verify every public package matches the registry
        if: >-
          !cancelled()
          && (steps.publish.outcome != 'skipped' || steps.publish-from-package.outcome != 'skipped')
        run: node scripts/assert-published-versions.mjs
