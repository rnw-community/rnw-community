name: Release and publish to NPM
on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  release:
    name: Publish a release
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      # Required for npm provenance attestations.
      id-token: write
      # Required to read the repository during checkout.
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Setup Git user
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          git config user.name "Vitalii Yehorov"
          git config user.email "vitalyiegorov@gmail.com"
          git remote rm origin
          git remote add origin https://vitalyiegorov:${GITHUB_TOKEN}@github.com/rnw-community/rnw-community.git
          git fetch
          git branch --set-upstream-to=origin/master master

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Unit tests
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Publish a release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: pnpm release
