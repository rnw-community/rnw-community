appId: ${APP_ID}
---
- runFlow:
    when:
      platform: iOS
    commands:
      # Presenting the Apple Pay sheet is the slowest thing the suite waits on, and
      # slowest of all on whichever flow runs first against a just-installed app.
      - extendedWaitUntil:
          visible:
            id: "dismiss"
          timeout: 45000
      - tapOn:
          id: "dismiss"
      - extendedWaitUntil:
          visible:
            id: "payments-flow-state"
            text: "rejected"
          timeout: 45000
