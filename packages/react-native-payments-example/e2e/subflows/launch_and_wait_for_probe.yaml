appId: ${APP_ID}
---
- launchApp:
    clearState: true
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "OK"
          optional: true
- assertVisible:
    id: "payments-flow-state"
    text: "idle"
- assertVisible:
    id: "action-show"
- extendedWaitUntil:
    notVisible:
      id: "payments-can-make-status"
      text: "checking"
    timeout: 15000
