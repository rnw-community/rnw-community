appId: ${APP_ID}
---
# The launch is retried because clearing app data removes the previous task,
# and when Android's remove-task destroy timeout fires after the relaunch has
# started it kills the new process by uid ("Killing <pid>: remove task"),
# leaving a blank window that never renders. A relaunch is unaffected.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - runFlow:
          when:
            platform: Android
          commands:
            - tapOn:
                text: "OK"
                optional: true
      # A bare assertVisible here only allowed Maestro's short implicit retry, so a cold
      # release launch on a loaded host reported the flow state as missing when it was
      # merely not rendered yet. The bound is for the slowest host, not for startup.
      - scrollUntilVisible:
          element:
            id: "payments-flow-state"
          direction: UP
          timeout: 60000
- extendedWaitUntil:
    visible:
      id: "payments-flow-state"
      text: "idle"
    timeout: 60000
- assertVisible:
    id: "action-show"
- extendedWaitUntil:
    notVisible:
      id: "payments-can-make-status"
      text: "checking"
    timeout: 15000
