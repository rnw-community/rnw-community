appId: ${APP_ID}
---
- launchApp:
    clearState: true
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "OK"
          optional: true
# A bare assertVisible here only allowed Maestro's short implicit retry, so a cold
# release launch on a loaded host reported the flow state as missing when it was
# merely not rendered yet. The bound is for the slowest host, not for startup.
- extendedWaitUntil:
    visible:
      id: "payments-flow-state"
      text: "idle"
    timeout: 60000
- assertVisible:
    id: "action-show"
- extendedWaitUntil:
    notVisible:
      id: "payments-can-make-status"
      text: "checking"
    timeout: 15000
