appId: ${APP_ID}
---
- runFlow: ../subflows/launch_and_wait_for_probe.yaml
- assertVisible:
    id: "payments-flow-state"
    text: "idle"
- runFlow: ../subflows/show_request.yaml
- runFlow: ../subflows/dismiss_ios_sheet.yaml
- runFlow:
    when:
      platform: Android
    commands:
      # On the CI device profile action-abort straddles the fold, so it is
      # scrolled fully on-screen before the tap.
      - scrollUntilVisible:
          element:
            id: "action-abort"
      - tapOn:
          id: "action-abort"
# The abort scroll may have moved the status section above the viewport; the
# scroll is a no-op when the state label is already on-screen (iOS path).
- scrollUntilVisible:
    element:
      id: "payments-flow-state"
    direction: UP
- extendedWaitUntil:
    visible:
      id: "payments-flow-state"
      text: "rejected"
    timeout: 45000
- scrollUntilVisible:
    element:
      id: "action-reset"
- tapOn:
    id: "action-reset"
- scrollUntilVisible:
    element:
      id: "payments-flow-state"
    direction: UP
- assertVisible:
    id: "payments-flow-state"
    text: "idle"
- scrollUntilVisible:
    element:
      text: ".*request reset.*"
- assertVisible:
    text: ".*request reset.*"
- runFlow: ../subflows/show_request.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: "dismiss"