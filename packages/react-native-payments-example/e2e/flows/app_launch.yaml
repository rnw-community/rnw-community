appId: ${APP_ID}
---
- runFlow: ../subflows/launch_and_wait_for_probe.yaml
- assertVisible:
    id: "builder-total-input"
    text: "20.00"
- assertVisible:
    id: "builder-shipping-toggle"
- assertVisible:
    id: "builder-async-update-toggle"
# On the CI device profile the Actions section straddles the fold: action-abort
# is only partially on-screen and action-reset is fully below it, so both are
# scrolled to instead of asserted in place.
- scrollUntilVisible:
    element:
      id: "action-abort"
- assertVisible:
    id: "action-abort"
- scrollUntilVisible:
    element:
      id: "action-reset"
- assertVisible:
    id: "action-reset"
- scrollUntilVisible:
    element:
      id: "event-log"
- assertVisible:
    id: "event-log-count"
- assertVisible:
    id: "event-log-row-0"
