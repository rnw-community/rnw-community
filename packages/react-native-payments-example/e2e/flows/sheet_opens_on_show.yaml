appId: ${APP_ID}
---
- runFlow: ../subflows/launch_and_wait_for_probe.yaml
- runFlow: ../subflows/show_request.yaml
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: "payments-flow-state"
          text: "showing"
- scrollUntilVisible:
    element:
      text: ".*show called.*"
- assertVisible:
    text: ".*show called.*"
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: "payments-flow-state"
            text: "rejected"
          timeout: 20000
      - scrollUntilVisible:
          element:
            text: ".*show rejected.*"
      - assertVisible:
          text: ".*show rejected.*"
      - assertVisible:
          id: "action-reset"
