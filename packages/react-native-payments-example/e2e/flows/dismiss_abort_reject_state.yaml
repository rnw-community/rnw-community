appId: ${APP_ID}
---
- runFlow: ../subflows/launch_and_wait_for_probe.yaml
- runFlow: ../subflows/show_request.yaml
- runFlow: ../subflows/dismiss_ios_sheet.yaml
- tapOn:
    id: "action-abort"
- extendedWaitUntil:
    visible:
      id: "payments-flow-state"
      text: "rejected"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: ".*abort called.*"
- assertVisible:
    text: ".*abort called.*"
