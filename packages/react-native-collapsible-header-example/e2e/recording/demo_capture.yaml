appId: ${APP_ID}
---
- launchApp:
      clearState: true
- extendedWaitUntil:
      visible:
          id: 'header-demo-expanded-amount'
      timeout: 15000
- startRecording: collapsible-header-demo
- swipe:
      start: 50%, 65%
      end: 50%, 35%
      duration: 900
- swipe:
      start: 50%, 35%
      end: 50%, 70%
      duration: 900
- swipe:
      start: 50%, 45%
      end: 50%, 75%
      duration: 700
- swipe:
      start: 50%, 70%
      end: 50%, 45%
      duration: 1200
- stopRecording
