appId: ${APP_ID}
---
- runFlow: ../subflows/launch_header_demo.yaml
- scroll
- extendedWaitUntil:
      visible:
          id: 'header-demo-collapsed-amount'
      timeout: 5000
- repeat:
      times: 3
      commands:
          - swipe:
                start: 50%, 40%
                end: 50%, 80%
- extendedWaitUntil:
      visible:
          id: 'header-demo-expanded-amount'
      timeout: 5000
- assertNotVisible:
      id: 'header-demo-collapsed-amount'
